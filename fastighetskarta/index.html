<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jernhusens fastigheter – inofficiell karta</title>
<meta name="description" content="Inofficiell karta över Jernhusens fastighetsbestånd och det svenska järnvägsnätet, byggd på öppna data.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: rgba(16, 20, 28, .94); --panel-solid: #10141c; --line: rgba(255,255,255,.10);
    --text: #e8ecf2; --muted: #8b95a5; --rail: #f5a524; --accent: #3ee0c5; --depa: #ff7a59; --station: #6aa8ff;
    --risk: #ff6b6b; --hover: rgba(255,255,255,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 0; }
  a { color: var(--accent); }
  button, select, input { font: inherit; color: inherit; }

  /* Toppmeny */
  #topp { position: absolute; z-index: 5; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center;
          gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
  .titel { display: flex; flex-direction: column; margin-right: 4px; line-height: 1.2; }
  .titel b { font-size: 14px; letter-spacing: .01em; white-space: nowrap; }
  .titel span { font-size: 10px; color: #ffd27a; white-space: nowrap; }
  #ind { max-width: 190px; }
  .textknapp { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; padding: 5px 4px; text-decoration: none; white-space: nowrap; }
  .textknapp:hover { color: var(--text); }
  .falt { display: flex; align-items: center; gap: 6px; }
  .falt label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  optgroup { color: var(--muted); font-style: normal; background: var(--panel-solid); }
  optgroup option { color: var(--text); }
  input[type=search], select { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 6px;
                               padding: 5px 8px; color: var(--text); }
  select option { background: var(--panel-solid); }
  #sok { width: 130px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 5px 9px; cursor: pointer; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #0d1117; font-weight: 600; }
  .knapp { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
           cursor: pointer; font-size: 13px; white-space: nowrap; }
  .knapp:hover, .seg button:hover:not(.on) { background: var(--hover); }
  .knapp.on { border-color: var(--rail); color: var(--rail); }
  /* Järnvägsknapparna i spårens färg: stark för huvudlinjer, dämpad för övriga */
  #huvudknapp.on { background: var(--rail); color: #0d1117; font-weight: 600; }
  #ovrigaknapp.on { background: color-mix(in srgb, var(--rail) 45%, transparent); color: var(--text); font-weight: 600; }
  #platt.on { background: none; color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }
  .knapp:disabled { opacity: .45; cursor: default; }
  .hoger { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  /* Paneler */
  .panel { position: absolute; z-index: 3; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           backdrop-filter: blur(6px); overflow: auto; }
  #lista { left: 12px; width: 300px; }
  #kort { right: 12px; width: 380px; display: none; }
  #legend { left: 12px; bottom: 12px; width: 300px; padding: 10px 12px; font-size: 12px; color: var(--muted); }
  .phuvud { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  .phuvud b { font-size: 13px; }
  ol { list-style: none; margin: 0; padding: 4px 0; }
  li { display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; padding: 6px 14px; cursor: pointer; }
  li:hover, li.vald { background: var(--hover); }
  .nr { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; font-size: 12px; padding-top: 1px; }
  .meta { grid-column: 2; color: var(--muted); font-size: 12px; }
  .stapel { grid-column: 2; height: 3px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
  .stapel span { display: block; height: 100%; }
  .utan { color: var(--muted); font-size: 12px; padding: 8px 14px; border-top: 1px solid var(--line); }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
  .rail { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px;
          background: var(--rail); box-shadow: 0 0 6px var(--rail); }

  /* Kort */
  .sektion { padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .sektion h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 7px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 400; color: var(--muted); padding: 2px 0; vertical-align: top; }
  td { text-align: right; padding: 2px 0 2px 8px; font-variant-numeric: tabular-nums; vertical-align: top; }
  .stor { font-size: 22px; font-weight: 650; }
  .kalla { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .liten { color: var(--muted); font-size: 11px; }
  .ja { color: var(--risk); font-weight: 600; }
  .notis { background: rgba(255,210,122,.08); border: 1px solid rgba(255,210,122,.35); border-radius: 6px; padding: 8px 10px; }

  #tagknapp.on { background: var(--accent); color: #0d1117; font-weight: 600; }
  #tagpanel { left: 324px; right: 60px; bottom: 12px; max-width: 680px; margin: 0 auto; padding: 8px 12px;
              display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; overflow: visible; }
  #tagpanel[hidden] { display: none; }
  #tagklocka { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; min-width: 58px; }
  #tagtid { flex: 1 1 200px; accent-color: var(--accent); }
  .tagrad { flex: 1 0 100%; font-size: 11px; color: var(--muted); }
  .maplibregl-popup-content { background: var(--panel-solid); color: var(--text); font-size: 12px; padding: 8px 10px; }
  .maplibregl-popup-tip { display: none; }
  .maplibregl-ctrl-attrib { background: rgba(16,20,28,.85) !important; color: var(--muted); font-size: 11px; }
  .maplibregl-ctrl-attrib a { color: var(--text); }
  .maplibregl-ctrl-group { background: var(--panel-solid); } .maplibregl-ctrl-group button span { filter: invert(1); }

  @media (max-width: 900px) {
    /* En rad som scrollar i sidled i stället för fem staplade rader */
    #topp { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    #topp::-webkit-scrollbar { display: none; }
    #topp > * { flex: 0 0 auto; }
    .hoger { margin-left: 0; }
    #sok { width: 130px; }
    #lista { width: auto; right: 12px; max-height: 30vh !important; top: auto !important; bottom: 12px; }
    #legend { display: none; }
    #kort { left: 12px; right: 12px; width: auto; max-height: 55vh !important; }
    #tagpanel { left: 12px; right: 12px; }
    body.taglage #lista { display: none; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="topp">
  <div class="titel" title="Inofficiell demo, inte en tjänst från Jernhusen AB"><b>Jernhusens fastigheter</b><span>Inofficiell demo</span></div>
  <div class="falt"><input id="sok" type="search" placeholder="Sök kommun, namn" aria-label="Sök"></div>
  <div class="seg" id="omrval" role="group" aria-label="Affärsområde">
    <button data-o="" class="on">Alla</button><button data-o="Stationer">Stationer</button><button data-o="Depåer och kombiterminaler">Depåer</button>
  </div>
  <div class="seg" id="kartval" role="group" aria-label="Bakgrundskarta">
    <button data-k="mork" class="on">Mörk</button><button data-k="ljus">Ljus</button><button data-k="detalj" title="Vanlig karta med alla detaljer">Standard</button><button data-k="foto">Flygfoto</button>
  </div>
  <div class="seg" role="group" aria-label="Järnväg">
    <button class="on" id="huvudknapp" aria-pressed="true"
      title="Huvudlinjer: stambanorna och andra stora linjer (OpenStreetMap usage=main), i hela landet.">Huvudlinjer</button>
    <button class="on ovriga" id="ovrigaknapp" aria-pressed="true"
      title="Övriga spår i dämpad färg: bandelar och sidolinjer i hela landet, och inzoomat (från ca zoom 14) även bangårdar, sidospår och industrispår.">Övriga spår</button>
    <button id="tagknapp" aria-pressed="false"
      title="Alla tåg en vanlig vardag enligt tidtabellen (GTFS), animerade längs spåren. Inte realtid.">Tåg i rörelse</button>
  </div>
  <div class="falt" title="Välj vilken uppgift punkterna på kartan färgas efter"><label for="ind">Färga</label><select id="ind"></select></div>
  <div class="hoger">
    <div class="seg" role="group" aria-label="Vy">
      <button id="platt" title="Räta upp kartan här: ingen lutning, norr uppåt, samma zoom">⟂ Platt</button>
      <button id="sverige" title="Platt översikt över hela Sverige">Hela Sverige</button>
    </div>
    <a class="textknapp" href="jamforelse.html">Jämförelse</a>
    <button class="textknapp" id="omknapp" title="Om kartan, källor och licenser">Om</button>
  </div>
</div>

<div id="lista" class="panel">
  <div class="phuvud"><b>Fastigheter</b><span class="liten" id="antal"></span></div>
  <ol id="fastlista"></ol>
</div>
<div id="kort" class="panel"></div>
<div id="legend" class="panel"></div>
<div id="tagpanel" class="panel" hidden>
  <button class="knapp" id="tagspela" aria-label="Pausa">❚❚</button>
  <span id="tagklocka">08:00</span>
  <input id="tagtid" type="range" min="0" max="1439" step="1" value="480" aria-label="Tid på dygnet">
  <select id="tagfart" aria-label="Hastighet">
    <option value="0.5">30 s per s</option><option value="2" selected>2 min per s</option><option value="10">10 min per s</option>
  </select>
  <div class="tagrad"><span id="tagantal"></span> <span id="tagtyper"></span></div>
</div>

<script>
// ---- hjälp ---------------------------------------------------------------------------
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const n = v => v === null || v === undefined || Number.isNaN(v) ? "–" : Number(v).toLocaleString("sv-SE", { maximumFractionDigits: 1 });
const rad = (k, v) => `<tr><th>${esc(k)}</th><td>${v}</td></tr>`;
const ODBL = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-bidragsgivare, ODbL';
const osmLank = (id, text) => `<a href="https://www.openstreetmap.org/${esc(id)}" target="_blank" rel="noopener">${esc(text || id)}</a>`;
const PDF_URL = "https://www.datocms-assets.com/163536/1772552927-fastighetsforteckning-2025-1.pdf";
const SVERIGE = { center: [16.5, 62.3], zoom: 4.3, pitch: 0, bearing: 0 };
const TYPER = ["Handel/Butik", "Hotell", "Industri/Depå", "Kontor", "Lager/Förråd", "Restaurang/Café", "Stationsverksamhet", "Övrigt"];

// ---- bakgrundskartor -----------------------------------------------------------------
const OFM = "https://tiles.openfreemap.org";
const FLYGFOTO = {
  version: 8, glyphs: `${OFM}/fonts/{fontstack}/{range}.pbf`,
  sources: {
    esri: { type: "raster", tileSize: 256, maxzoom: 19,
            tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
            attribution: 'Flygfoto: <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a>, Maxar, Earthstar Geographics och GIS-användarsamfundet' },
    openmaptiles: { type: "vector", url: `${OFM}/planet` },
  },
  layers: [{ id: "flygfoto", type: "raster", source: "esri" }],
};
const KARTOR = {
  mork:   { stil: `${OFM}/styles/dark`,     hus: "#3a4250", rail: "#f5a524", text: "#e8ecf2", halo: "#0d1117" },
  ljus:   { stil: `${OFM}/styles/positron`, hus: "#d5dae1", rail: "#d97706", text: "#1d2430", halo: "#ffffff" },
  detalj: { stil: `${OFM}/styles/liberty`,  hus: "#d9d0c9", rail: "#c2410c", text: "#1d2430", halo: "#ffffff" },
  foto:   { stil: FLYGFOTO,                 hus: null,      rail: "#ffb703", text: "#ffffff", halo: "#000000" },
};
let karta = "mork", huvudPa = true, ovrigaPa = true;
const HUVUD_LAGER = ["jarnvag", "jarnvag-glod"], OVRIGA_LAGER = ["spar-bandel", "spar-ovriga-alla"];

// ---- indikatorer för färgläggning ------------------------------------------------------
const RAMP = ["#c7e9f1", "#7fcbe0", "#3ea6cf", "#1f78b4", "#0b3d6e"];
const SAKNAS = "#7a828f";
const OMR = { "Stationer": "--station", "Depåer och kombiterminaler": "--depa" };
const jaNej = (v, ja = "#ff6b6b") => ({ "Ja": ja, "Nej": "#5b6472" });
const NP_FARG = { "balans": "#4ade80", "stress": "#ff6b6b", "beroende": "#8b95a5", "obalanserad nod": "#f5a524", "obalanserad plats": "#6aa8ff" };
const NP_TEXT = {
  "balans": "nod och plats i balans",
  "stress": "mycket trafik och mycket stad: risk för trängsel och konkurrens om ytan",
  "beroende": "lite trafik och lite stad",
  "obalanserad nod": "mer trafik än stad runt stationen: utrymme för fler bostäder, arbetsplatser och service",
  "obalanserad plats": "mer stad än trafik: stationen kan behöva bättre trafik",
};
const TAGTYPER = [["Snabbtåg", "#ff5d8f"], ["Fjärr- och interregionala tåg", "#ffd166"], ["Regional- och pendeltåg", "#5ee7ff"]];
// grupp = rubrik i menyn
const IND = {
  omr:     { grupp: "Fastigheten", namn: "Affärsområde", kat: p => p["Affärsområde"], farger: () => Object.fromEntries(Object.entries(OMR).map(([k, v]) => [k, css(v)])) },
  tag:     { grupp: "Trafik", namn: "Tågavgångar per vardag", num: p => p.trafik?.avgangar.tag, kalla: "Trafiklab" },
  tagtim:  { grupp: "Trafik", namn: "Flest tåg under en timme", num: p => p.trafik?.tag_max_per_timme, kalla: "Trafiklab" },
  buss:    { grupp: "Trafik", namn: "Bussavgångar per vardag", num: p => p.trafik?.avgangar.buss, kalla: "Trafiklab" },
  bef:     { grupp: "Befolkning och omgivning", namn: "Invånare inom 1 km", num: p => p.befolkning?.inom_1km, kalla: "SCB" },
  syss:    { grupp: "Befolkning och omgivning", namn: "Sysselsättningsgrad (DeSO)", num: p => p.demografi?.sysselsattning_20_64, kalla: "SCB", enhet: "%" },
  ink:     { grupp: "Befolkning och omgivning", namn: "Nettoinkomst (DeSO)", num: p => p.demografi?.nettoinkomst_tkr, kalla: "SCB", enhet: "tkr" },
  service: { grupp: "Befolkning och omgivning", namn: "Butiker, mat och service inom 500 m", num: p => p.service_500m && (p.service_500m.butiker + p.service_500m.mat_dryck + p.service_500m.service), kalla: "OpenStreetMap" },
  anst:    { grupp: "Arbetsplatser", namn: "Anställda inom 1 km (verksamhetsområden)", num: p => p.arbetsplatser?.anstallda_verksamhetsomraden_1km, kalla: "SCB" },
  dagkvot: { grupp: "Arbetsplatser", namn: "Dagbefolkning per nattbefolkning, kommunen", num: p => p.arbetsplatser?.kommun_dag_natt_kvot, kalla: "SCB", enhet: "ggr", dec: 2 },
  r30:     { grupp: "Restid med tåg", namn: "Invånare som nås inom 30 min", num: p => p.restid?.invanare_30, kalla: "Trafiklab, SCB", saknas: "Ingen tågstation inom 1 km" },
  r60:     { grupp: "Restid med tåg", namn: "Invånare som nås inom 60 min", num: p => p.restid?.invanare_60, kalla: "Trafiklab, SCB", saknas: "Ingen tågstation inom 1 km" },
  np:      { grupp: "Restid med tåg", namn: "Nod–plats-typ", kat: p => p.nodplats?.typ ?? null, kalla: "egen analys", saknas: "Ingen tågstation inom 1 km",
             farger: () => NP_FARG },
  spar:    { grupp: "Fastigheten", namn: "Spårlängd inom 300 m", num: p => p.spar?.totalt_m, kalla: "OpenStreetMap", enhet: "m" },
  temp:    { grupp: "Klimat", namn: "Årsmedeltemperatur", num: p => p.klimat?.arsmedel_temp, kalla: "SMHI", enhet: "°C" },
  neder:   { grupp: "Klimat", namn: "Årsnederbörd", num: p => p.klimat?.arsnederbord_mm, kalla: "SMHI", enhet: "mm" },
  su85:    { grupp: "Klimat", namn: "Fler högsommardygn 2071–2100 (RCP8.5, länet)", num: p => p.framtidsklimat?.su?.rcp85_2071?.forandring, kalla: "SMHI", enhet: "dygn" },
  r20_85:  { grupp: "Klimat", namn: "Fler dygn med minst 20 mm regn 2071–2100 (RCP8.5, länet)", num: p => p.framtidsklimat?.r20mm?.rcp85_2071?.forandring, kalla: "SMHI", enhet: "dygn" },
  flod:    { grupp: "Risker och natur", namn: "Översvämning inom 100 m", kat: p => p.risk ? (p.risk.q100 ? "100-årsflöde" : p.risk.bhf ? "Bara högsta flöde" : "Nej") : null,
             farger: () => ({ "100-årsflöde": "#ff6b6b", "Bara högsta flöde": "#f5a524", "Nej": "#5b6472" }), kalla: "MCF" },
  skred:   { grupp: "Risker och natur", namn: "Skred/stabilitet inom 100 m", kat: p => p.risk ? ((p.risk.sgu_skred !== null || p.risk.stabilitet) ? "Ja" : "Nej") : null, farger: () => jaNej(), kalla: "SGU, MCF" },
  natur:   { grupp: "Risker och natur", namn: "Skyddad natur inom 500 m", kat: p => p.skyddad_natur ? (p.skyddad_natur.omraden.length ? "Ja" : "Nej") : null, farger: () => jaNej("#4ade80"), kalla: "Naturvårdsverket" },
  lamn:    { grupp: "Kulturmiljö", namn: "Kulturhistoriska lämningar inom 250 m", num: p => p.kulturmiljo?.antal_lamningar, kalla: "RAÄ" },
  bminne:  { grupp: "Kulturmiljö", namn: "Byggnadsminne inom 250 m", kat: p => p.kulturmiljo ? (p.kulturmiljo.byggnadsminnen.length ? "Ja" : "Nej") : null, farger: () => jaNej("#e9a873"), kalla: "RAÄ" },
};
let ind = "omr", brytpunkter = [], minVarde = 0;
function beraknaBryt() {
  const I = IND[ind]; brytpunkter = [];
  if (!I.num) return;
  const v = data.features.map(f => I.num(f.properties)).filter(x => x !== null && x !== undefined).sort((a, b) => a - b);
  minVarde = v[0];
  brytpunkter = [...new Set([1, 2, 3, 4].map(i => v[Math.floor(i * v.length / 5)]))].filter(b => b > minVarde);
}
const klassFarg = i => RAMP[brytpunkter.length ? Math.round(i * 4 / brytpunkter.length) : 2];
function farg(p) {
  const I = IND[ind];
  if (I.kat) { const k = I.kat(p); return k === null || k === undefined ? SAKNAS : (I.farger()[k] || SAKNAS); }
  const x = I.num(p);
  return x === null || x === undefined ? SAKNAS : klassFarg(brytpunkter.filter(b => x >= b).length);
}
function ritaLegend() {
  const I = IND[ind], heltal = !I.enhet || I.enhet === "m" || I.enhet === "mm";
  const f = x => heltal ? Math.round(x).toLocaleString("sv-SE") : Number(x).toLocaleString("sv-SE", { maximumFractionDigits: I.dec ?? 1 });
  const e = I.enhet ? " " + I.enhet : "";
  const sw = c => `<span class="sw" style="background:${c}"></span>`;
  let h = `<div style="margin-bottom:2px">Punkterna färgas efter</div><div style="color:var(--text);font-weight:600;margin-bottom:4px">${esc(I.namn)}</div>`;
  h += I.kat ? Object.entries(I.farger()).map(([k, c]) => `<div>${sw(c)}${esc(k)}</div>`).join("")
    : [minVarde, ...brytpunkter].map((fr, i) => {
        const till = i < brytpunkter.length ? brytpunkter[i] : null;
        const t = till === null ? f(fr) + e + " och mer" : heltal ? (fr === till - 1 ? f(fr) : f(fr) + "–" + f(till - 1)) + e : f(fr) + " till under " + f(till) + e;
        return `<div>${sw(klassFarg(i))}${t}</div>`; }).join("");
  if (ind !== "omr") h += `<div>${sw(SAKNAS)}${esc(I.saknas || "Uppgift saknas")}</div><div style="margin-top:3px">Källa: ${esc(I.kalla)}</div>`;
  h += `<div style="margin-top:8px">Punktens storlek visar lokalarean.</div>`;
  h += `<div style="margin-top:4px"><span class="rail"></span>Huvudlinjer (stambanor m.fl.)</div>`;

function egnaLager() {

  // Järnväg i två grupper med egna knappar:
  //  Huvudlinjer  (OSM usage=main: stambanorna och andra stora linjer) – stark färg med glöd

      paint: { "line-color": K.rail, "line-opacity": 0.5,
               "line-width": ["interpolate", ["linear"], ["zoom"], 12, ["case", ["has", "service"], 0.5, 0.9], 17, ["case", ["has", "service"], 1.6, 2.4]] } });
  }
  map.addSource("jarnvag", { type: "geojson", data: dataJarnvag });
  const ar = u => ["==", ["get", "usage"], u];
  const bredd = (a, b) => ["interpolate", ["linear"], ["zoom"], 4, a, 10, b, 15, b * 2.5];
  map.addLayer({ id: "spar-bandel", type: "line", source: "jarnvag", filter: ar("branch"), layout: { ...rund, visibility: syn(ovrigaPa) },
    paint: { "line-color": K.rail, "line-opacity": 0.5, "line-width": bredd(0.6, 1.3) } });

    paint: { "line-color": K.rail, "line-opacity": 0.3, "line-blur": 3, "line-width": bredd(4, 9) } });
  map.addLayer({ id: "jarnvag", type: "line", source: "jarnvag", filter: ar("main"), layout: { ...rund, visibility: syn(huvudPa) },
    paint: { "line-color": K.rail, "line-opacity": 0.95, "line-width": bredd(1.1, 2.4) } });
  // Restidsomland: nådda stationer, färg efter minuter
  map.addSource("restid", { type: "geojson", data: restidFC() });

    "text-field": ["concat", ["get", "namn"], " · ", ["to-string", ["get", "min"]], " min"], "text-font": ["Noto Sans Regular"],
    "text-size": 11, "text-offset": [0, 1.1], "text-anchor": "top", "text-optional": true },

  // Tåg i rörelse

  map.addLayer({ id: "fast", type: "circle", source: "fast", paint: {

      <span class="stapel"><span style="width:${100 * (p["Lokalarea Summa"] || 0) / maxLoa}%;background:${css(OMR[p["Affärsområde"]])}"></span></span></li>`).join("") +
    (data.utan_lage?.length && !s && !omrFilter ? `<li class="utan" style="display:block;cursor:default">Saknar läge och visas inte på kartan:

let RESTID = null, restidId = null;
const TOM = { type: "FeatureCollection", features: [] };
function restidFC() {
  if (!RESTID || !restidId || !RESTID.fastigheter[restidId]) return TOM;
  return { type: "FeatureCollection", features: RESTID.fastigheter[restidId].filter(([, m]) => m <= 60).map(([i, m]) => {
    const [namn, lon, lat] = RESTID.stationer[i];
    return { type: "Feature", geometry: { type: "Point", coordinates: [lon, lat] }, properties: { namn, min: m } };
  }) };
}
async function visaRestid(id) {
  if (!RESTID) RESTID = await fetch("restid.json", { cache: "no-cache" }).then(r => r.json());
  restidId = id;
  const fc = restidFC();
  map.getSource("restid")?.setData(fc);
  if (!fc.features.length) return;
  const b = new maplibregl.LngLatBounds();
  fc.features.forEach(f => b.extend(f.geometry.coordinates));
  map.fitBounds(b, { padding: { top: 90, bottom: 60, left: 340, right: 410 }, pitch: 0, bearing: 0, maxZoom: 11, duration: 2000 });
}

// ---- tåg i rörelse -----------------------------------------------------------------------
// Tidtabellen för en vardag (GTFS). Mellan stationerna följer tåget spåret i OSM (förberäknat i tag.json).
let TAG = null, tagPa = false, tagSpelar = true, tagTid = 8 * 60, tagFC = TOM, senast = 0, senastRitad = 0;
const tagFart = () => Number(document.getElementById("tagfart").value);
function forbered(T) {
  const kosLat = Math.cos(62 * Math.PI / 180);
  T.str = T.strackor.map(s => {
    const xy = []; for (let i = 0; i < s.length; i += 2) xy.push([s[i], s[i + 1]]);
    const L = [0]; for (let i = 1; i < xy.length; i++) L.push(L[i - 1] + Math.hypot((xy[i][0] - xy[i - 1][0]) * kosLat, xy[i][1] - xy[i - 1][1]));
    return { xy, L };
  });
  T.span = T.turer.map(t => [t[3][2], t[3][t[3].length - 3]]);   // första avgång, sista ankomst
}
function langs(str, f) {
  const { xy, L } = str, mal = f * L[L.length - 1];
  let i = 1; while (i < L.length - 1 && L[i] < mal) i++;
  const d = L[i] - L[i - 1], g = d ? (mal - L[i - 1]) / d : 0;
  return [xy[i - 1][0] + g * (xy[i][0] - xy[i - 1][0]), xy[i - 1][1] + g * (xy[i][1] - xy[i - 1][1])];
}
function position(seq, t) {
  for (let i = 0; i + 4 < seq.length + 1; i += 4) {
    const [s, ank, avg, str] = seq.slice(i, i + 4);
    if (t < ank) return null;
    if (t <= avg) return TAG.stationer[s].slice(1);
    if (i + 4 >= seq.length) return null;
    const ank2 = seq[i + 5];
    if (t < ank2) {
      const f = (t - avg) / (ank2 - avg), a = TAG.stationer[s], b = TAG.stationer[seq[i + 4]];
      if (str >= 0) return langs(TAG.str[str], f);
      if (str <= -2) return langs(TAG.str[-2 - str], 1 - f);
      return [a[1] + f * (b[1] - a[1]), a[2] + f * (b[2] - a[2])];
    }
  }
  return null;
}
function ritaTag() {
  const fs = [];
  TAG.turer.forEach((tur, i) => {
    for (const t of [tagTid, tagTid + 1440]) {          // nattåg från dagen före har tider över 24:00
      const [a, b] = TAG.span[i];
      if (t < a || t > b) continue;
      const p = position(tur[3], t);
      if (p) { fs.push({ type: "Feature", geometry: { type: "Point", coordinates: p }, properties: { i, typ: tur[0] } }); break; }
    }
  });
  tagFC = { type: "FeatureCollection", features: fs };
  map.getSource("tag")?.setData(tagFC);
  const h = Math.floor(tagTid / 60), m = Math.floor(tagTid % 60);
  document.getElementById("tagklocka").textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
  document.getElementById("tagtid").value = Math.floor(tagTid);
  document.getElementById("tagantal").textContent = `${fs.length} tåg i trafik enligt tidtabellen ${TAG.referensdag}.`;
}
function tagLoop(ts) {
  if (!tagPa) return;
  if (senast && tagSpelar) tagTid = (tagTid + (ts - senast) / 1000 * tagFart()) % 1440;
  senast = ts;
  if (ts - senastRitad > 66) { senastRitad = ts; ritaTag(); }   // ca 15 bilder per sekund räcker
  requestAnimationFrame(tagLoop);
}
document.getElementById("tagtyper").innerHTML = TAGTYPER.map(([t, c]) => `<span class="sw" style="background:${c}"></span>${esc(t)}`).join(" &nbsp;");
document.getElementById("tagknapp").onclick = async e => {
  const k = e.currentTarget;
  tagPa = !tagPa; k.classList.toggle("on", tagPa); k.setAttribute("aria-pressed", tagPa);
  document.getElementById("tagpanel").hidden = !tagPa; document.body.classList.toggle("taglage", tagPa);
  if (!tagPa) { tagFC = TOM; map.getSource("tag")?.setData(TOM); return; }
  if (!TAG) { k.textContent = "Laddar …"; TAG = await fetch("tag.json", { cache: "no-cache" }).then(r => r.json()); forbered(TAG); k.textContent = "Tåg i rörelse"; }
  senast = 0; ritaTag(); requestAnimationFrame(tagLoop);
};
document.getElementById("tagspela").onclick = e => {
  tagSpelar = !tagSpelar; e.currentTarget.textContent = tagSpelar ? "❚❚" : "▶";
  e.currentTarget.setAttribute("aria-label", tagSpelar ? "Pausa" : "Spela");
};
document.getElementById("tagtid").oninput = e => { tagTid = Number(e.target.value); if (TAG) ritaTag(); };
map.on("click", "tag-punkt", e => {
  const tur = TAG.turer[e.features[0].properties.i], seq = tur[3];
  const fran = TAG.stationer[seq[0]][0], till = TAG.stationer[seq[seq.length - 4]][0];
  const tid = v => { const x = ((v % 1440) + 1440) % 1440; return `${String(Math.floor(x / 60)).padStart(2, "0")}:${String(Math.floor(x % 60)).padStart(2, "0")}`; };
  new maplibregl.Popup({ closeButton: false }).setLngLat(e.lngLat).setHTML(
    `<b>${esc(TAG.operatorer[tur[1]] || "Tåg")}${tur[2] ? " " + esc(tur[2]) : ""}</b><br>${esc(TAGTYPER[tur[0]][0])}<br>
     ${esc(fran)} ${tid(seq[2])} → ${esc(till)} ${tid(seq[seq.length - 3])}`).addTo(map);
});
map.on("mouseenter", "tag-punkt", () => map.getCanvas().style.cursor = "pointer");
map.on("mouseleave", "tag-punkt", () => map.getCanvas().style.cursor = "");

// ---- nod–plats-diagram i kortet -----------------------------------------------------------
function nodPlatsSvg(p) {
  const lagen = new Map();
  data.features.forEach(f => { const q = f.properties.nodplats; if (q) lagen.set(q.station, q); });
  const S = 180, P = 22, x = v => P + v * (S - 2 * P), y = v => S - P - v * (S - 2 * P);
  const prick = (q, egen) => `<circle cx="${x(q.nod)}" cy="${y(q.plats)}" r="${egen ? 6 : 3.2}" fill="${NP_FARG[q.typ]}"
    ${egen ? 'stroke="#fff" stroke-width="2"' : 'opacity=".55"'}><title>${esc(q.station)}</title></circle>`;
  return `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img" aria-label="Nod–plats-diagram" style="display:block;margin:4px auto">
    <rect x="${P}" y="${P}" width="${S - 2 * P}" height="${S - 2 * P}" fill="none" stroke="var(--line)"/>
    <polygon points="${x(0)},${y(0.15)} ${x(0)},${y(0)} ${x(0.15)},${y(0)} ${x(1)},${y(0.85)} ${x(1)},${y(1)} ${x(0.85)},${y(1)}" fill="rgba(74,222,128,.08)"/>
    <text x="${S / 2}" y="${S - 5}" fill="var(--muted)" font-size="10" text-anchor="middle">Nod (trafik) →</text>
    <text x="10" y="${S / 2}" fill="var(--muted)" font-size="10" text-anchor="middle" transform="rotate(-90 10 ${S / 2})">Plats (stad) →</text>
    ${[...lagen.values()].filter(q => q.station !== p.nodplats.station).map(q => prick(q, false)).join("")}${prick(p.nodplats, true)}</svg>`;
}

// ---- kort: om och källor ---------------------------------------------------------------
function visaOm() {
  const k = document.getElementById("kort");
  k.innerHTML = `<div class="phuvud"><b>Om kartan</b><button class="knapp" id="stang">Stäng</button></div>
    <div class="sektion"><p class="notis" style="margin-top:0">Inofficiell demo, gjord som ett privat projekt. Inte framtagen av eller för
      Jernhusen AB och ersätter inte bolagets egna uppgifter.</p>
    <p>Kartan visar fastigheterna i Jernhusens publicerade <a href="${PDF_URL}" target="_blank" rel="noopener">fastighetsförteckning
      per 2025-12-31</a>. Varje punkt är ett ungefärligt läge, framtaget från adressen i förteckningen och förbättrat med
      Trafikverkets stationslägen och namngivna depåer i OpenStreetMap. Punkten är inte fastighetens gräns.</p>
    <p>Klicka på en fastighet för att se uppgifterna och flyga in i 3D. <b>Platt</b> rätar upp kartan där du är;
      <b>Hela Sverige</b> visar översikten igen. Under <b>Färga</b> väljer du
      vilken uppgift punkterna färgas efter. Alla avstånd räknas från punkten.</p>
    <p><b>Tåg i rörelse</b> spelar upp alla tåg en vanlig vardag enligt tidtabellen, längs spåren. I kortet för en
      stationsfastighet finns restidsomlandet med tåg och en <a href="nodplats.html">nod–plats-analys</a>.</p>
    <p class="liten">Fastighetsgränser och energideklarationer finns inte med: Lantmäteriets och Boverkets villkor tillåter inte att de
      publiceras öppet. Turkosa byggnader är byggnader i OpenStreetMap som kopplats till fastigheten (på adressen, med samma namn,
      stationsbyggnader intill eller byggnader på depåmark). Det är en uppskattning, inte uppgift om ägande.</p></div>
    <div class="sektion"><h2>Källor och licenser</h2><ul style="padding-left:18px;margin:0" class="liten">
      <li>Fastighetsdata: Jernhusen AB, fastighetsförteckning 2025-12-31. © Jernhusen AB.</li>
      <li>Lägen, byggnader, stationer, service, spår, järnvägsnät: © OpenStreetMap-bidragsgivare (Nominatim, Overpass). ODbL 1.0.</li>
      <li>Stationslägen: Trafikverket, stationsregister. CC0.</li>
      <li>Kollektivtrafik, restidsomland och tåg i rörelse: GTFS Sverige 2, Samtrafiken via <a href="https://www.trafiklab.se/api/gtfs-datasets/gtfs-sverige-2/" target="_blank" rel="noopener">Trafiklab</a>. CC0.
        Tågens väg längs spåren: OpenStreetMap (ODbL).</li>
      <li>Befolkning (1 km-rutor), DeSO-statistik, verksamhets- och handelsområden och sysselsatta efter arbetsställe (TAB1828):
        <a href="https://www.scb.se" target="_blank" rel="noopener">SCB</a>. Källa: SCB.</li>
      <li>Klimat 1991–2020: <a href="https://www.smhi.se/data" target="_blank" rel="noopener">SMHI</a>. CC BY 4.0, bearbetad.
        Framtida klimat: <a href="https://www.smhi.se/klimat/framtidens-klimat/klimatscenariotjansten" target="_blank" rel="noopener">SMHI Klimatscenariotjänsten</a>, länsmedel, bearbetad.</li>
      <li>Nod–plats-modellen: L. Bertolini (1999), <i>Spatial development patterns and public transport</i>. Egen tillämpning.</li>
      <li>Skyddad natur: Naturvårdsverket, Naturvårdsregistret. CC0.</li>
      <li>Översvämning och stabilitet: <a href="https://www.mcf.se/sv/verktyg--tjanster/oversvamningsportalen/" target="_blank" rel="noopener">MCF</a>. Skred och jordart: <a href="https://www.sgu.se" target="_blank" rel="noopener">SGU</a>, CC0.</li>
      <li>Kulturmiljö: <a href="https://www.raa.se/hitta-information/oppna-data/oppna-data-portal/" target="_blank" rel="noopener">Riksantikvarieämbetet</a>. CC0/CC BY.</li>
      <li>Bakgrundskartor: <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> (© OpenMapTiles, data från OpenStreetMap); flygfoto: Esri.</li>
      <li>Kartbibliotek: <a href="https://maplibre.org" target="_blank" rel="noopener">MapLibre GL JS</a> (BSD-3). Kod: MIT, © 2026 Lukas Posolda.</li>
    </ul><p class="kalla">Metoder och detaljer i <a href="README.md">README</a>. Data sammanställd ${esc(data?.metadata?.skapad || "")}.</p></div>`;
  k.style.display = "block"; k.scrollTop = 0;
  document.getElementById("stang").onclick = () => { k.style.display = "none"; };
}

// ---- kort: fastighet ---------------------------------------------------------------------
function valj(id) {
  const f = data.features.find(x => x.properties.id === id), p = f.properties;
  valdId = id; markeraVald(); ritaLista(); doljRestid();
  map.flyTo({ center: f.geometry.coordinates, zoom: 16, pitch: 60, bearing: ((p.rank * 37) % 120) - 60, duration: 3000, essential: true });
  const k = document.getElementById("kort");
  k.innerHTML = kortHtml(p); k.style.display = "block"; k.scrollTop = 0;
  document.getElementById("stang").onclick = () => { k.style.display = "none"; };
  const rk = document.getElementById("restidknapp");
  if (rk) rk.onclick = () => restidId === id ? (doljRestid(), rk.textContent = "Visa på kartan")
                                             : (visaRestid(id), rk.textContent = "Dölj på kartan");
}

function kortHtml(p) {
  const typer = TYPER.filter(t => p[t]).map(t => rad(t, n(p[t]) + " kvm")).join("");
  const byg = dataBygg.features.filter(b => b.properties.fastighet === p.id);
  const urv = { adress: "byggnaden på adressen", namn: "samma namn", station: "stationsbyggnad intill", jarnvagsmark: "på depåmark" };
  let h = `<div class="phuvud" style="display:block"><div class="liten">#${p.rank} · ${esc(p["Affärsområde"])}</div>
    <div style="font-size:19px;font-weight:650;margin:2px 0">${esc(p.Fastighetsbeskrivning || p.Fastighetsbeteckning)}</div>
    <div class="liten">${esc(p.Kommun)} ${esc(p.Fastighetsbeteckning)}${p.Adress ? " · " + esc(p.Adress) : ""}</div>
    <div style="margin-top:8px"><button class="knapp" id="stang">Stäng</button></div></div>`;
  h += `<div class="sektion"><h2>Lokalarea</h2><div class="stor">${n(p["Lokalarea Summa"])} kvm</div>
    <table style="margin-top:6px">${typer}</table>
    <div class="kalla">Jernhusens <a href="${PDF_URL}" target="_blank" rel="noopener">fastighetsförteckning 2025-12-31</a>, sida ${esc(p.pdf_sida)}.</div></div>`;
  h += `<div class="sektion"><h2>Byggnader (${byg.length})</h2>` + (byg.length
    ? `<table>${byg.map(b => rad(b.properties.namn || "Byggnad", `${osmLank(b.properties.osm, "OSM")} · ${esc(urv[b.properties.urval] || "")}`)).join("")}</table>`
    : `<div class="liten">Ingen byggnad kunde kopplas till fastigheten.</div>`) +
    `<div class="kalla">Byggnader i OpenStreetMap kopplade till fastigheten, turkosa på kartan. En uppskattning, inte uppgift om ägande. ${ODBL}.</div></div>`;
  const t = p.trafik;
  if (t) h += `<div class="sektion"><h2>Kollektivtrafik inom 500 m, en vardag</h2><table>
    ${rad("Tågavgångar", "<b>" + n(t.avgangar.tag) + "</b>")}${t.avgangar.tag ? rad("Flest tåg på en timme", n(t.tag_max_per_timme)) + rad("Första / sista tåg", esc(t.tag_forsta) + " – " + esc(t.tag_sista)) : ""}
    ${rad("Bussavgångar", n(t.avgangar.buss))}${rad("Spårvagn och tunnelbana", n(t.avgangar.sparvag_tunnelbana))}${t.avgangar.bat ? rad("Båt", n(t.avgangar.bat)) : ""}</table>
    ${t.tag_operatorer.length ? `<div class="liten" style="margin-top:4px">Tågoperatörer: ${esc(t.tag_operatorer.join(", "))}</div>` : ""}
    <div class="kalla">Planerad trafik ${esc(t.referensdag)}, GTFS Sverige 2 (version ${esc(t.gtfs_version)}), Samtrafiken via Trafiklab, CC0.
    En tur räknas en gång även om den stannar vid flera hållplatser.</div></div>`;
  const s = p.osm_station;
  h += `<div class="sektion"><h2>Närmaste järnvägsstation</h2>` + (s
    ? `<table>${rad(s.namn, "ca " + n(s.avstand_m) + " m")}</table><div class="kalla">${osmLank(s.osm, "Visa i OSM")}. ${ODBL}.</div>`
    : `<div class="liten">Ingen station inom 500 m i OpenStreetMap.</div>`) + `</div>`;
  const rt = p.restid;
  if (rt) h += `<div class="sektion"><h2>Restid med tåg, vardagsmorgon</h2><table>
    <tr><th></th><td class="liten">30 min</td><td class="liten">60 min</td></tr>
    <tr><th>Invånare nära en nådd station</th><td><b>${n(rt.invanare_30)}</b></td><td><b>${n(rt.invanare_60)}</b></td></tr>
    <tr><th>Anställda i verksamhetsområden</th><td>${n(rt.anstallda_vo_30)}</td><td>${n(rt.anstallda_vo_60)}</td></tr>
    <tr><th>Stationer</th><td>${n(rt.stationer_30)}</td><td>${n(rt.stationer_60)}</td></tr></table>
    ${rt.storsta_mal.length ? `<div class="liten" style="margin-top:6px">Största orter inom en timme: ${rt.storsta_mal.map(m => esc(m.station.replace(/ Centralstation$/, " C").replace(/ station$/, "")) + " " + m.minuter + " min").join(", ")}</div>` : ""}
    <div style="margin-top:8px"><button class="knapp" id="restidknapp">Visa på kartan</button></div>
    <div class="kalla">Snabbaste resa med tåg från ${esc(rt.startstationer.join(" / "))}, avresa ${esc(rt.avresa)} ${esc(rt.referensdag)}, byten minst 3 min,
    gång till stationen 1,3 m/s. Bara tåg. Invånare i SCB:s 1 km-rutor inom 1 km från en nådd station (bara Sverige); anställda är ett golv
    (stadskärnor ingår inte i verksamhetsområdena). GTFS Sverige 2 (CC0), SCB.</div></div>`;
  const np = p.nodplats;
  if (np) h += `<div class="sektion"><h2>Nod–plats</h2>${nodPlatsSvg(p)}
    <div><span class="sw" style="background:${NP_FARG[np.typ]}"></span><b>${esc(np.typ[0].toUpperCase() + np.typ.slice(1))}</b>: ${esc(NP_TEXT[np.typ])}.</div>
    <table style="margin-top:6px">${rad("Nodvärde (trafik)", n(np.nod))}${rad("Platsvärde (stad)", n(np.plats))}</table>
    <div class="kalla">Bertolinis nod–plats-modell, relativ inom Jernhusens ${np.lagen} stationslägen (0 = lägst, 1 = högst).
    <a href="nodplats.html">Hela analysen</a>.</div></div>`;
  const b = p.befolkning, dm = p.demografi, sv = p.service_500m;
  if (b || dm || sv) h += `<div class="sektion"><h2>Omgivning</h2><table>
    ${b ? rad("Invånare inom 1 km (ca)", n(b.inom_1km)) : ""}
    ${dm ? rad("Sysselsättningsgrad 20–64 år, DeSO", n(dm.sysselsattning_20_64) + " %") + rad("Nettoinkomst, medel, DeSO", n(dm.nettoinkomst_tkr) + " tkr")
         + rad("… kommunen / riket", n(dm.nettoinkomst_kommun_tkr) + " / " + n(dm.nettoinkomst_riket_tkr) + " tkr")
         + rad("Låg / hög ekonomisk standard", n(dm.lag_ek_standard) + " / " + n(dm.hog_ek_standard) + " %") : ""}
    ${sv ? rad("Butiker / mat och dryck inom 500 m", n(sv.butiker) + " / " + n(sv.mat_dryck)) + rad("Busshållplatser / cykelparkering", n(sv.busshallplatser) + " / " + n(sv.cykelparkering)) : ""}</table>
    <div class="kalla">SCB: 1 km-rutor 2025 och DeSO ${esc(dm?.deso || "")} år ${esc(dm?.ar || "")} (de boende, inte de som arbetar där).
    Service: OpenStreetMap, ett minimum. ${ODBL}.</div></div>`;
  const ap = p.arbetsplatser;
  if (ap) h += `<div class="sektion"><h2>Arbetsplatser och dagbefolkning</h2><table>
    ${rad("Anställda i verksamhetsområden inom 1 km", "<b>" + n(ap.anstallda_verksamhetsomraden_1km) + "</b>")}
    ${rad("Anställda i handelsområden inom 1 km", n(ap.anstallda_handel_1km))}
    ${ap.storsta_bransch ? rad("Största bransch i närmaste område", `<span class="liten">${esc(ap.storsta_bransch)}</span>`) : ""}
    ${ap.kommun_dagbefolkning ? rad("Kommunen: arbetar / bor och arbetar", n(ap.kommun_dagbefolkning) + " / " + n(ap.kommun_nattbefolkning))
      + rad("Dagbefolkning per nattbefolkning", n(ap.kommun_dag_natt_kvot)) + rad("Inpendlare till kommunen", n(ap.kommun_inpendlare)) : ""}</table>
    <div class="kalla">SCB: verksamhets- och handelsområden ${esc(ap.omraden_ar)} (andel av områdets anställda som ligger inom 1 km). Områdena omfattar
    industri, kontor, handel och logistik utanför bostadsområden men inte stadskärnor, så siffran är ett golv. Kommunen: sysselsatta
    efter arbetsställe och bostad, ${esc(ap.kommun_ar)} (TAB1828). Källa: SCB.</div></div>`;
  const kl = p.klimat;
  if (kl) h += `<div class="sektion"><h2>Klimat ${esc(kl.period)}</h2><table>
    ${rad("Årsmedeltemperatur", n(kl.arsmedel_temp) + " °C")}${rad("Januari / juli", n(kl.jan_temp) + " / " + n(kl.jul_temp) + " °C")}${rad("Årsnederbörd", n(kl.arsnederbord_mm) + " mm")}</table>
    <div class="kalla">Normalvärden ur SMHI:s månadsvärden. Temperatur: ${esc(kl.temp_station || "–")}; nederbörd: ${esc(kl.neder_station || "–")}.
    SMHI, CC BY 4.0, bearbetad.</div></div>`;
  const fk = p.framtidsklimat;
  if (fk) {
    const fm = v => v === null || v === undefined ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toLocaleString("sv-SE", { maximumFractionDigits: 1 });
    const r = (namn, k, e = "") => { const q = fk[k] || {};
      return `<tr><th>${esc(namn)}</th><td>${q.referens === undefined ? "–" : n(q.referens) + e}</td><td>${fm(q.rcp85_2041?.forandring)}</td><td>${fm(q.rcp45_2071?.forandring)}</td><td><b>${fm(q.rcp85_2071?.forandring)}</b></td></tr>`; };
    h += `<div class="sektion"><h2>Framtida klimat och skyfall, ${esc(fk.lan)}</h2><table style="font-size:12px">
      <tr><th></th><td class="liten">1971–2000</td><td class="liten">2041–70<br>RCP8.5</td><td class="liten">2071–2100<br>RCP4.5</td><td class="liten">2071–2100<br>RCP8.5</td></tr>
      ${r("Årsmedeltemperatur (°C)", "tas")}${r("Högsommardygn, minst 25 °C", "su")}${r("Tropiska nätter, minst 20 °C", "tr")}
      ${r("Dygn med minst 10 mm regn", "r10mm")}${r("Dygn med minst 20 mm regn", "r20mm")}
      <tr><th>Årsnederbörd</th><td>–</td><td>${fm(fk.pr?.rcp85_2041?.forandring)} %</td><td>${fm(fk.pr?.rcp45_2071?.forandring)} %</td><td><b>${fm(fk.pr?.rcp85_2071?.forandring)} %</b></td></tr>
      ${r("Graddagar uppvärmning", "hd17")}${r("Kylgraddagar", "ddgt20")}</table>
      <p class="liten" style="margin:8px 0 0"><b>Skyfall:</b> SMHI:s nationella skyfallskartering räknar med att korta, kraftiga regn blir
      20 % (RCP4.5) respektive 40 % (RCP8.5) intensivare i slutet av seklet. Ytor nära vattendrag: se översvämning under Naturrisker.</p>
      <div class="kalla">Länsmedel, inte lokala värden. Förändring mot 1971–2000, ensemblemedel av klimatmodeller (EURO-CORDEX).
      Referensvärden ur observationsbaserade data. <a href="https://www.smhi.se/klimat/framtidens-klimat/klimatscenariotjansten" target="_blank" rel="noopener">SMHI Klimatscenariotjänsten</a>,
      bearbetad. Klimatfaktorer: <a href="https://www.smhi.se/tema/hantera-vatten-och-klimat/hantera-oversvamning-till-foljd-av-skyfall/riskkartering-oversvamningskansliga-omraden-vid-skyfall" target="_blank" rel="noopener">SMHI</a>.</div></div>`;
  }
  const sp = p.spar;
  if (sp) h += `<div class="sektion"><h2>Spår inom ${n(sp.radie_m)} m</h2><table>
    ${rad("Totalt", "<b>" + n(sp.totalt_m) + " m</b>")}${rad("Huvudspår / bangård", n(sp.huvudspar) + " / " + n(sp.bangard) + " m")}
    ${rad("Sidospår / anslutningsspår", n(sp.sidospar) + " / " + n(sp.anslutningsspar) + " m")}${rad("Elektrifierat", n(sp.elektrifierat_m) + " m")}</table>
    <div class="kalla">OpenStreetMap railway=rail, spårtyp enligt OSM:s taggning. ${ODBL}.</div></div>`;
  const rk = p.risk;
  if (rk) {
    const j = v => v === null || v === undefined || v === false ? "Nej" : `<span class="ja">Ja</span>`;
    h += `<div class="sektion"><h2>Naturrisker inom 100 m</h2><table>
      ${rad("Översvämning, 100-årsflöde", j(rk.q100))}${rad("Översvämning, 200-årsflöde", j(rk.q200))}${rad("Översvämning, högsta flöde", j(rk.bhf))}
      ${rad("Stabilitetskartering (MCF)", j(rk.stabilitet))}${rad("Aktsamhetsområde skred (SGU)", j(rk.sgu_skred))}${rad("Jordart", esc(rk.jordart || "–"))}</table>
      <div class="kalla">MCF och SGU (CC0). "Nej" betyder att inget är karterat inom 100 m, inte att risk saknas.</div></div>`;
  }
  const nat = p.skyddad_natur;
  if (nat) h += `<div class="sektion"><h2>Skyddad natur inom 500 m</h2>` + (nat.omraden.length
    ? `<table>${nat.omraden.map(o => rad(o.namn + " (" + o.skyddstyp + ")", o.avstand_m === 0 ? "i området" : "ca " + n(o.avstand_m) + " m")).join("")}</table>`
    : `<div class="liten">Inga gällande skyddade områden.</div>`) + `<div class="kalla">Naturvårdsverket, Naturvårdsregistret, CC0.</div></div>`;
  const km = p.kulturmiljo;
  if (km) {
    const lank = (u, t) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>` : esc(t);
    h += `<div class="sektion"><h2>Kulturmiljö inom 250 m</h2><table>
      ${km.byggnadsminnen.map(x => rad("Byggnadsminne", lank(x.url, x.namn))).join("")}
      ${rad("Inventerad bebyggelse", n(km.antal_bebyggelse))}${rad("Kulturhistoriska lämningar", n(km.antal_lamningar) + " (varav " + n(km.antal_fornlamningar) + " fornlämningar)")}</table>
      <div class="kalla">Riksantikvarieämbetet, öppna data. Kvaliteten kan variera; kontakta länsstyrelsen inför markarbeten.</div></div>`;
  }
  h += `<div class="sektion"><h2>Läge</h2><div>${esc(p.lage_metod)}</div>
    <div class="kalla">${p.lage_flyttad_m !== undefined ? `Adressen träffade bara gatan, så punkten flyttades ca ${n(p.lage_flyttad_m)} m. ` : ""}
    Punkten är ungefärlig och visar inte fastighetens gräns.</div></div>`;
  return h;
}
</script>
