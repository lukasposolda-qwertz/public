<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jernhusens fastigheter – inofficiell karta</title>
<meta name="description" content="Inofficiell karta över Jernhusens fastighetsbestånd, byggd på den publicerade fastighetsförteckningen och OpenStreetMap.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2430; --muted: #5d6676; --line: #e2e5ea;
    --accent: #0b5cad; --stationer: #1f6feb; --depaer: #c2410c; --warn-bg: #fff7e0; --warn-line: #e0b84a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
               color: var(--text); background: var(--bg); }
  #app { display: grid; grid-template-columns: 290px minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px;
           padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .inoff { margin-left: auto; font-size: 12px; background: var(--warn-bg); border: 1px solid var(--warn-line);
                  padding: 2px 8px; border-radius: 4px; }
  aside { background: var(--panel); overflow: auto; min-width: 0; min-height: 0; }
  #filters { border-right: 1px solid var(--line); }
  #detail { border-left: 1px solid var(--line); }
  .section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
                margin: 0 0 8px; font-weight: 600; }
  label { display: block; margin: 2px 0; cursor: pointer; }
  select, input[type=search] { width: 100%; padding: 5px; font: inherit; border: 1px solid var(--line); border-radius: 4px; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 6px;
            border: 1px solid rgba(0,0,0,.15); }
  #lista { list-style: none; margin: 0; padding: 0; }
  #lista li { padding: 6px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  #lista li:hover, #lista li.vald { background: #eef4fb; }
  .liten { color: var(--muted); font-size: 12px; }
  .nopos { color: #b45309; font-size: 11px; }
  #mapwrap { position: relative; min-width: 0; min-height: 0; }
  #map { position: absolute; inset: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; width: 55%; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .kalla { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .notice { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto auto; height: auto; }
    #mapwrap { grid-row: 2; }
    #filters, #detail { border: 0; }
    #lista { max-height: 40vh; overflow: auto; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Jernhusens fastigheter</h1>
    <span class="sub">enligt fastighetsförteckningen per 2025-12-31</span>
    <a href="3d/" style="font-size:13px">Tio största i 3D →</a>
    <a href="jamforelse.html" style="font-size:13px">Jämförelsetabell →</a>
    <span class="inoff">Inofficiell demo, inte en tjänst från Jernhusen AB</span>
  </header>

  <aside id="filters">
    <div class="section">
      <h2>Sök</h2>
      <input type="search" id="fSok" placeholder="Kommun, beteckning eller namn">
    </div>
    <div class="section">
      <h2>Kommun</h2>
      <select id="fKommun"><option value="">Alla kommuner</option></select>
    </div>
    <div class="section">
      <h2>Färga efter</h2>
      <select id="fInd"></select>
      <div id="legend" style="margin-top:8px"></div>
    </div>
    <div class="section">
      <h2>Affärsområde</h2>
      <div id="fOmr"></div>
      <div class="liten" style="margin-top:6px">Punktens storlek visar lokalarean.</div>
    </div>
    <div class="section" style="padding-bottom:4px"><h2 id="antal">Fastigheter</h2></div>
    <ul id="lista"></ul>
  </aside>

  <div id="mapwrap"><div id="map"></div></div>

  <aside id="detail"></aside>
</div>

<script>
const OMR = { "Stationer": "--stationer", "Depåer och kombiterminaler": "--depaer" };
const TYPER = ["Handel/Butik", "Hotell", "Industri/Depå", "Kontor", "Lager/Förråd", "Restaurang/Café", "Stationsverksamhet", "Övrigt"];
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const kvm = v => v === null || v === undefined ? '<span class="muted">–</span>' : v.toLocaleString("sv-SE");

let data, valdId = null;
const map = L.map("map").setView([62, 16], 5);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bidragsgivare'
}).addTo(map);
const lager = L.layerGroup().addTo(map);
const byggLager = L.layerGroup();      // OSM-byggnader, visas från zoom 15
map.on("zoomend", () => map.getZoom() >= 15 ? map.addLayer(byggLager) : map.removeLayer(byggLager));
const osmLank = (id, text) => `<a href="https://www.openstreetmap.org/${esc(id)}" target="_blank" rel="noopener">${esc(text || id)}</a>`;
const ODBL = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-bidragsgivare, ODbL';
const radie = p => 5 + Math.sqrt(p["Lokalarea Summa"] || 0) / 18;

// Indikatorer för färgläggning. Numeriska delas i fem lika stora grupper (kvintiler).
const RAMP = ["#dbe9f6", "#9ecae1", "#5ba3cf", "#2171b5", "#08306b"];
const SAKNAS = "#b8bec8";
const INDIKATORER = {
  omr:     { namn: "Affärsområde", kat: p => p["Affärsområde"], farger: () => Object.fromEntries(Object.entries(OMR).map(([k, v]) => [k, css(v)])) },
  tag:     { namn: "Tågavgångar per vardag inom 500 m", num: p => p.trafik?.avgangar.tag, kalla: "Trafiklab, GTFS Sverige 2" },
  tagtim:  { namn: "Flest tåg under en timme", num: p => p.trafik?.tag_max_per_timme, kalla: "Trafiklab, GTFS Sverige 2" },
  punkt:   { namn: "Avgångar i tid (högst 5 min sena)", num: p => p.punktlighet?.andel_i_tid, kalla: "Trafikverket", omvand: true, enhet: "%" },
  inst:    { namn: "Inställda avgångar", num: p => p.punktlighet?.andel_installda, kalla: "Trafikverket", enhet: "%" },
  kollbuss:{ namn: "Bussavgångar per vardag inom 500 m", num: p => p.trafik?.avgangar.buss, kalla: "Trafiklab, GTFS Sverige 2" },
  syss:    { namn: "Sysselsättningsgrad 20–64 år (DeSO)", num: p => p.demografi?.sysselsattning_20_64, kalla: "SCB 2024", enhet: "%" },
  ink:     { namn: "Nettoinkomst, medel (DeSO)", num: p => p.demografi?.nettoinkomst_tkr, kalla: "SCB 2024" },
  temp:    { namn: "Årsmedeltemperatur 1991–2020", num: p => p.klimat?.arsmedel_temp, kalla: "SMHI", enhet: "°C" },
  neder:   { namn: "Årsnederbörd 1991–2020", num: p => p.klimat?.arsnederbord_mm, kalla: "SMHI" },
  sparl:   { namn: "Spårlängd inom 300 m", num: p => p.spar?.totalt_m, kalla: "OpenStreetMap" },
  bef:     { namn: "Invånare inom 1 km", num: p => p.befolkning?.inom_1km, kalla: "SCB 2025" },
  service: { namn: "Butiker, mat och service inom 500 m", num: p => p.service_500m && (p.service_500m.butiker + p.service_500m.mat_dryck + p.service_500m.service), kalla: "OpenStreetMap" },
  buss:    { namn: "Busshållplatser inom 500 m", num: p => p.service_500m?.busshallplatser, kalla: "OpenStreetMap" },
  cykel:   { namn: "Cykelparkeringar inom 500 m", num: p => p.service_500m?.cykelparkering, kalla: "OpenStreetMap" },
  natur:   { namn: "Skyddad natur inom 500 m", kat: p => p.skyddad_natur ? (p.skyddad_natur.omraden.length ? "Ja" : "Nej") : null,
             farger: () => ({ "Ja": "#15803d", "Nej": "#d6dbe1" }), kalla: "Naturvårdsverket" },
  lamn:    { namn: "Kulturhistoriska lämningar inom 250 m", num: p => p.kulturmiljo?.antal_lamningar, kalla: "Riksantikvarieämbetet" },
  bminne:  { namn: "Byggnadsminne inom 250 m", kat: p => p.kulturmiljo ? (p.kulturmiljo.byggnadsminnen.length ? "Ja" : "Nej") : null,
             farger: () => ({ "Ja": "#9a3412", "Nej": "#d6dbe1" }), kalla: "Riksantikvarieämbetet" },
  flod:    { namn: "Översvämning (100-årsflöde) inom 100 m", kat: p => p.risk ? (p.risk.q100 !== null ? "Ja" : (p.risk.bhf !== null ? "Bara vid högsta flöde" : "Nej")) : null,
             farger: () => ({ "Ja": "#b91c1c", "Bara vid högsta flöde": "#f59e0b", "Nej": "#d6dbe1" }), kalla: "MCF" },
  skred:   { namn: "Skred eller stabilitetsrisk inom 100 m", kat: p => p.risk ? ((p.risk.sgu_skred !== null || p.risk.stabilitet !== null) ? "Ja" : "Nej") : null,
             farger: () => ({ "Ja": "#7c2d12", "Nej": "#d6dbe1" }), kalla: "SGU, MCF" },
  station: { namn: "Järnvägsstation inom 500 m", kat: p => p.osm_station ? "Ja" : (p.befolkning ? "Nej" : null),
             farger: () => ({ "Ja": "#1f6feb", "Nej": "#d6dbe1" }), kalla: "OpenStreetMap" },
};
let ind = "omr", brytpunkter = [], minVarde = 0;

function beraknaBrytpunkter() {
  const I = INDIKATORER[ind];
  if (!I.num) { brytpunkter = []; return; }
  const v = data.features.map(f => I.num(f.properties)).filter(x => x !== null && x !== undefined).sort((a, b) => a - b);
  minVarde = v[0];
  // Kvintiler, men dubbletter tas bort så att skeva fördelningar (många nollor) ger färre, giltiga klasser
  brytpunkter = [...new Set([1, 2, 3, 4].map(i => v[Math.floor(i * v.length / 5)]))].filter(b => b > minVarde);
}
const klassFarg = i => RAMP[brytpunkter.length ? Math.round(i * 4 / brytpunkter.length) : 2];
function farg(p) {
  const I = INDIKATORER[ind];
  if (I.kat) { const k = I.kat(p); return k === null || k === undefined ? SAKNAS : (I.farger()[k] || SAKNAS); }
  const x = I.num(p);
  if (x === null || x === undefined) return SAKNAS;
  return klassFarg(brytpunkter.filter(b => x >= b).length);
}
function ritaLegend() {
  const I = INDIKATORER[ind], fmt = n => Math.round(n).toLocaleString("sv-SE");
  const sw = c => `<span class="swatch" style="background:${c}"></span>`;
  let h = I.kat ? Object.entries(I.farger()).map(([k, c]) => `<div>${sw(c)}${esc(k)}</div>`).join("")
    : [minVarde, ...brytpunkter].map((fran, i) => {
        // Heltal (antal): "8–17". Andelar i procent: gränsen är "under nästa brytpunkt".
        const pct = I.enhet === "%" || I.enhet === "°C";       // decimaltal: gräns = "under nästa brytpunkt"
        const fmt = n => pct ? Number(n).toLocaleString("sv-SE", { maximumFractionDigits: 1 }) : Math.round(n).toLocaleString("sv-SE");
        const till = i < brytpunkter.length ? (pct ? brytpunkter[i] : brytpunkter[i] - 1) : null;
        const e = " " + I.enhet;
        const text = pct
          ? (till === null ? fmt(fran) + e + " och mer" : i === 0 ? "under " + fmt(till) + e : fmt(fran) + " till under " + fmt(till) + e)
          : till === null ? fmt(fran) + " och fler" : fran === till ? fmt(fran) : fmt(fran) + "–" + fmt(till);
        return `<div>${sw(klassFarg(i))}${text}</div>`;
      }).join("");
  if (ind !== "omr") h += `<div>${sw(SAKNAS)}Uppgift saknas</div><div class="liten" style="margin-top:4px">Källa: ${esc(I.kalla)}</div>`;
  document.getElementById("legend").innerHTML = h;
}

function om() {
  const m = data.metadata;
  return `<div class="section"><h2>Om kartan</h2>
    <p class="notice">Det här är en <b>inofficiell demo</b>, gjord som ett privat projekt. Den är inte framtagen av
    eller för Jernhusen AB och ersätter inte bolagets egna uppgifter.</p>
    <p>Kartan visar fastigheterna i Jernhusens publicerade
    <a href="${esc(m.kalla_url)}" target="_blank" rel="noopener">fastighetsförteckning per 2025-12-31</a>.
    Lokalarea (LOA) och lokaltyper är återgivna som i förteckningen.</p>
    <p>Punkterna är <b>ungefärliga lägen</b>. De är framtagna genom att adressen i förteckningen har sökts i
    OpenStreetMap (Nominatim). Punkten är alltså inte fastighetens gräns eller en exakt position.
    Fastigheter vars adress inte gick att hitta i rätt kommun saknar punkt och visas bara i listan.</p>
    <p>När punkten ligger i en byggnad i OpenStreetMap visas byggnaden (zooma in). Varje fastighet visar också
    närmaste järnvägsstation inom 500 m, befolkningen inom 1 km, kollektivtrafiken inom 500 m en vanlig vardag, punktligheten vid närmaste station de senaste tre dygnen,service inom 500 m, skyddad natur inom 500 m och kulturmiljö (lämningar, inventerad bebyggelse och byggnadsminnen) inom 250 m.
    Välj under <b>Färga efter</b> vilken uppgift punkterna ska färgas efter. Alla avstånd räknas från punkten.</p>
    <p class="liten">Fastighetsgränser och energideklarationer finns inte med. De kommer från Lantmäteriet och
    Boverket, vars villkor inte tillåter att uppgifterna publiceras öppet.</p></div>
    <div class="section"><h2>Källor och licenser</h2>
    <ul style="padding-left:18px;margin:0">
      <li>Fastighetsdata: ${esc(m.kalla)}. © Jernhusen AB.</li>
      <li>Lägen (koordinater): © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-bidragsgivare,
          via Nominatim. Licens <a href="https://opendatacommons.org/licenses/odbl/" target="_blank" rel="noopener">ODbL 1.0</a>.</li>
      <li>Byggnader och stationer: © OpenStreetMap-bidragsgivare, via
          <a href="https://overpass-api.de" target="_blank" rel="noopener">Overpass API</a>. Licens ODbL 1.0.</li>
      <li>Service inom 500 m: © OpenStreetMap-bidragsgivare, via Overpass API. Licens ODbL 1.0.</li>
      <li>Befolkning: <a href="https://www.scb.se/vara-tjanster/oppna-data/oppna-geodata/" target="_blank" rel="noopener">SCB</a>,
          befolkning per 1 km-ruta 2025 (öppna geodata). Källa: SCB.</li>
      <li>Skyddad natur: <a href="https://geodata.naturvardsverket.se/nedladdning/naturvardsregistret/" target="_blank" rel="noopener">Naturvårdsverket</a>,
          Naturvårdsregistret. Licens CC0. Källa: Naturvårdsverket.</li>
      <li>Kollektivtrafik: <a href="https://www.trafiklab.se/api/gtfs-datasets/gtfs-sverige-2/" target="_blank" rel="noopener">GTFS Sverige 2</a>,
          Samtrafiken i Sverige AB via Trafiklab. Licens CC0 1.0. Källa: Trafiklab.</li>
      <li>Punktlighet och inställda tåg: <a href="https://data.trafikverket.se/" target="_blank" rel="noopener">Trafikverket</a>,
          API Öppna Data (TrainAnnouncement). Licens CC0 1.0. Källa: Trafikverket.</li>
      <li>Befolkning per DeSO (sysselsättning, inkomst, ekonomisk standard): <a href="https://www.statistikdatabasen.scb.se" target="_blank" rel="noopener">SCB</a>,
          Statistikdatabasen och DeSO 2025. Källa: SCB.</li>
      <li>Klimat: <a href="https://www.smhi.se/data" target="_blank" rel="noopener">SMHI</a>, meteorologiska observationer, normalperiod 1991–2020.
          Licens CC BY 4.0. Källa: SMHI (bearbetad).</li>
      <li>Spår: © OpenStreetMap-bidragsgivare (railway=rail), via Overpass. ODbL.</li>
      <li>Naturrisker: <a href="https://www.mcf.se/sv/verktyg--tjanster/oversvamningsportalen/" target="_blank" rel="noopener">MCF</a>
          (översvämnings- och stabilitetskarteringar, öppen WFS) och <a href="https://www.sgu.se" target="_blank" rel="noopener">SGU</a>
          (skred i finkornig jordart, CC0; jordarter). Källa: MCF, SGU.</li>
      <li>Kulturmiljö: <a href="https://www.raa.se/hitta-information/oppna-data/oppna-data-portal/" target="_blank" rel="noopener">Riksantikvarieämbetet</a>,
          kulturhistoriska lämningar, kulturhistoriskt inventerad bebyggelse och byggnadsminnen. Licens CC0/CC BY. Källa: Riksantikvarieämbetet.</li>
      <li>Bakgrundskarta: © OpenStreetMap-bidragsgivare.</li>
      <li>Kartbibliotek: <a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a> (BSD-2-Clause).</li>
      <li>Kod: MIT-licens, © 2026 Lukas Posolda.</li>
    </ul>
    <p class="kalla">Data sammanställd ${esc(m.skapad)}.</p></div>`;
}

function filtrerade() {
  const k = document.getElementById("fKommun").value;
  const s = document.getElementById("fSok").value.trim().toLowerCase();
  const omr = [...document.querySelectorAll("#fOmr input:checked")].map(i => i.value);
  return data.features.filter(({ properties: p }) =>
    (!k || p.Kommun === k) && omr.includes(p["Affärsområde"]) &&
    (!s || [p.Kommun, p.Fastighetsbeteckning, p.Fastighetsbeskrivning, p.Adress].join(" ").toLowerCase().includes(s)));
}

function rita() {
  lager.clearLayers(); byggLager.clearLayers();
  const fs = filtrerade();
  for (const f of fs) {
    if (!f.geometry) continue;
    const p = f.properties, [lon, lat] = f.geometry.coordinates, vald = p.id === valdId;
    if (p.osm_byggnad) {
      L.geoJSON(p.osm_byggnad.geometry, { style: { color: css(OMR[p["Affärsområde"]]), weight: vald ? 3 : 1.5,
        fillColor: css(OMR[p["Affärsområde"]]), fillOpacity: .2 } })
        .bindTooltip(`Byggnad på adressen (OSM)`).on("click", () => valj(p.id)).addTo(byggLager);
    }
    L.circleMarker([lat, lon], { radius: radie(p), color: vald ? "#000" : "#fff", weight: vald ? 3 : 1.5,
      fillColor: farg(p), fillOpacity: .9 })
      .bindTooltip(`${esc(p.Fastighetsbeskrivning || p.Fastighetsbeteckning)}<br><span class="liten">${esc(p.Kommun)} ${esc(p.Fastighetsbeteckning)}</span>`)
      .on("click", () => valj(p.id)).addTo(lager);
  }
  ritaLegend();
  document.getElementById("antal").textContent = `Fastigheter (${fs.length} av ${data.features.length})`;
  const ul = document.getElementById("lista");
  ul.innerHTML = fs.map(({ geometry, properties: p }) => `<li data-id="${esc(p.id)}" class="${p.id === valdId ? "vald" : ""}">
    <span class="swatch" style="background:${farg(p)}"></span>${esc(p.Fastighetsbeskrivning || p.Fastighetsbeteckning)}
    <div class="liten">${esc(p.Kommun)} ${esc(p.Fastighetsbeteckning)}</div>
    ${geometry ? "" : '<div class="nopos">Saknar läge på kartan</div>'}</li>`).join("");
  ul.querySelectorAll("li").forEach(li => li.onclick = () => valj(li.dataset.id, true));
  return fs.filter(f => f.geometry).map(f => [f.geometry.coordinates[1], f.geometry.coordinates[0]]);
}

function osmSektioner(p) {
  const b = p.osm_byggnad, s = p.osm_station;
  const rad = (k, v) => v ? `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>` : "";
  const typ = { yes: "Ospecificerad", train_station: "Stationsbyggnad", commercial: "Kommersiell", office: "Kontor",
                industrial: "Industri", retail: "Handel", warehouse: "Lager", parking: "Parkeringshus", hotel: "Hotell" };
  return `<div class="section"><h2>Byggnad på adressen</h2>` + (b
    ? `<table>${rad("Byggnadstyp (OSM)", typ[b.building] || b.building)}${rad("Namn", b.name)}${rad("Våningar", b["building:levels"])}
        ${rad("Byggår", b.start_date)}${rad("Adress i OSM", [b["addr:street"], b["addr:housenumber"]].filter(Boolean).join(" "))}</table>
       <div class="kalla">Den byggnad i OpenStreetMap som adresspunkten ligger i. Visar inte fastighetens gräns och inte
       nödvändigtvis alla byggnader på fastigheten. ${osmLank(b.osm, "Visa i OSM")}. Hämtad ${esc(b.hamtad)} via Overpass. ${ODBL}.</div>`
    : `<div class="muted">Ingen entydig byggnad i OpenStreetMap på adressen${(p.lage_metod || "").startsWith("Adress (husnummer)") ? "" : " (läget är inte en exakt adress)"}.</div>`) +
    `</div><div class="section"><h2>Närmaste järnvägsstation</h2>` + (s
    ? `<table>${rad("Namn", s.namn)}${rad("Typ", s.typ === "halt" ? "Hållplats" : "Station")}${rad("Avstånd", "ca " + s.avstand_m + " m")}${rad("Operatör", s.operator)}</table>
       <div class="kalla">${osmLank(s.osm, "Visa i OSM")}${s.wikidata ? ` · <a href="https://www.wikidata.org/wiki/${esc(s.wikidata)}" target="_blank" rel="noopener">Wikidata</a>` : ""}.
       Hämtad ${esc(s.hamtad)} via Overpass. ${ODBL}.</div>`
    : `<div class="muted">Ingen station eller hållplats inom 500 m i OpenStreetMap.</div>`) + `</div>` + omgivning(p);
}

function omgivning(p) {
  const n = v => v === null || v === undefined ? '<span class="muted">–</span>' : Number(v).toLocaleString("sv-SE");
  const rad = (k, v) => `<tr><th>${esc(k)}</th><td class="num">${v}</td></tr>`;
  const b = p.befolkning, s = p.service_500m, nat = p.skyddad_natur, tr = p.trafik;
  let h = "";
  if (tr) h += `<div class="section"><h2>Kollektivtrafik inom 500 m</h2><table>
      ${rad("Tågavgångar per vardag", "<b>" + n(tr.avgangar.tag) + "</b>")}
      ${tr.avgangar.tag ? rad("Flest tåg under en timme", n(tr.tag_max_per_timme)) + rad("Första och sista tåg", esc(tr.tag_forsta) + " – " + esc(tr.tag_sista)) : ""}
      ${rad("Bussavgångar per vardag", n(tr.avgangar.buss))}${rad("Spårvagn och tunnelbana", n(tr.avgangar.sparvag_tunnelbana))}
      ${tr.avgangar.bat ? rad("Båt", n(tr.avgangar.bat)) : ""}${rad("Hållplatser inom 500 m", n(tr.hallplatser))}</table>
      ${tr.tag_operatorer.length ? `<div class="liten" style="margin-top:4px">Tågoperatörer: ${esc(tr.tag_operatorer.join(", "))}</div>` : ""}
      <div class="kalla">Planerad trafik ${esc(tr.referensdag)} (en vanlig tisdag) enligt
      <a href="https://www.trafiklab.se/api/gtfs-datasets/gtfs-sverige-2/" target="_blank" rel="noopener">GTFS Sverige 2</a>
      från Samtrafiken via Trafiklab, version ${esc(tr.gtfs_version)} (CC0). En tur som stannar vid flera hållplatser inom
      500 m räknas en gång; tåg som slutar här räknas inte som avgångar.</div></div>`;
  const pk = p.punktlighet;
  if (pk) h += `<div class="section"><h2>Punktlighet, ${esc(pk.station)}</h2><table>
      ${rad("Avgångar i tid (högst " + pk.grans_min + " min sena)", "<b>" + n(pk.andel_i_tid) + " %</b>")}
      ${rad("Inställda avgångar", n(pk.installda) + " (" + n(pk.andel_installda) + " %)")}
      ${rad("Medelförsening, avgångna tåg", n(pk.medelforsening_min) + " min")}
      ${rad("Annonserade avgångar", n(pk.avgangar))}${pk.utan_utfall ? rad("Utan registrerad avgångstid", n(pk.utan_utfall)) : ""}</table>
      <div class="kalla">${esc(pk.period_fran)} – ${esc(pk.period_till)}: alla annonserade avgångar från ${esc(pk.station)}
      (${esc(pk.koppling.toLowerCase())}, ca ${n(pk.avstand_m)} m från punkten). Andelen i tid räknas på avgångna och inställda tåg.
      Ett kort fönster på tre dygn, så siffrorna kan svänga mycket. Källa:
      <a href="https://data.trafikverket.se/" target="_blank" rel="noopener">Trafikverket, API Öppna Data</a> (TrainAnnouncement), CC0 1.0.
      Hämtad ${esc(pk.hamtad)}.</div></div>`;
  if (b) h += `<div class="section"><h2>Befolkning inom 1 km</h2><table>
      ${rad("Invånare (ca)", "<b>" + n(b.inom_1km) + "</b>")}${rad("0–19 år", n(b.alder_0_19))}${rad("20–64 år", n(b.alder_20_64))}${rad("65 år och äldre", n(b.alder_65_plus))}</table>
      <div class="kalla">Uppskattning från SCB:s befolkning per 1 km-ruta per ${esc(b.referenstid)}, viktad med hur stor del av
      varje ruta som ligger inom 1 km från punkten. Källa: <a href="https://www.scb.se/vara-tjanster/oppna-data/oppna-geodata/" target="_blank" rel="noopener">SCB, öppna geodata</a>.
      Hämtad ${esc(b.hamtad)}.</div></div>`;
  if (s) h += `<div class="section"><h2>Service inom 500 m</h2><table>
      ${rad("Butiker", n(s.butiker))}${rad("Restauranger, kaféer, barer", n(s.mat_dryck))}
      ${rad("Apotek, bank, vård, skola m.m.", n(s.service))}${rad("Busshållplatser", n(s.busshallplatser))}${rad("Cykelparkeringar", n(s.cykelparkering))}</table>
      <div class="kalla">Antal objekt i OpenStreetMap inom 500 m fågelvägen. OSM är inte heltäckande, så siffrorna är
      ett minimum. Hämtad ${esc(s.hamtad)} via Overpass. ${ODBL}.</div></div>`;
  if (nat) h += `<div class="section"><h2>Skyddad natur inom 500 m</h2>` + (nat.omraden.length
      ? `<table>${nat.omraden.map(o => `<tr><th>${esc(o.namn)}<div class="liten">${esc(o.skyddstyp)}</div></th>
          <td class="num">${o.avstand_m === 0 ? "Punkten ligger i området" : "ca " + n(o.avstand_m) + " m"}</td></tr>`).join("")}</table>`
      : `<div class="muted">Inga gällande skyddade områden inom 500 m.</div>`) +
      `<div class="kalla">Källa: <a href="https://geodata.naturvardsverket.se/nedladdning/naturvardsregistret/" target="_blank" rel="noopener">Naturvårdsverket, Naturvårdsregistret</a> (CC0).
      Hämtad ${esc(nat.hamtad)}. Avståndet räknas från punkten, inte från fastighetens gräns.</div></div>`;
  const dm = p.demografi;
  if (dm) h += `<div class="section"><h2>Befolkning i DeSO-området</h2><table>
      ${rad("Sysselsättningsgrad 20–64 år", n(dm.sysselsattning_20_64) + " %")}
      ${rad("Nettoinkomst, medel", n(dm.nettoinkomst_tkr) + " tkr")}
      ${rad("… kommunen / riket", n(dm.nettoinkomst_kommun_tkr) + " / " + n(dm.nettoinkomst_riket_tkr) + " tkr")}
      ${rad("Låg ekonomisk standard", n(dm.lag_ek_standard) + " % (kommunen " + n(dm.lag_ek_standard_kommun) + " %)")}
      ${rad("Hög ekonomisk standard", n(dm.hog_ek_standard) + " %")}</table>
      <div class="kalla">DeSO ${esc(dm.deso)} (DeSO 2025), år ${esc(dm.ar)}. Beskriver de som bor i området, inte de som arbetar där.
      Källa: <a href="https://www.statistikdatabasen.scb.se" target="_blank" rel="noopener">SCB, Statistikdatabasen</a> (TAB6680, TAB6683, TAB6685)
      och SCB:s DeSO-indelning. Hämtad ${esc(dm.hamtad)}.</div></div>`;
  const kl = p.klimat;
  if (kl) h += `<div class="section"><h2>Klimat ${esc(kl.period)}</h2><table>
      ${rad("Årsmedeltemperatur", n(kl.arsmedel_temp) + " °C")}${rad("Januari / juli", n(kl.jan_temp) + " / " + n(kl.jul_temp) + " °C")}
      ${rad("Årsnederbörd", n(kl.arsnederbord_mm) + " mm")}</table>
      <div class="kalla">Normalvärden beräknade ur SMHI:s kvalitetskontrollerade månadsvärden. Temperatur: ${esc(kl.temp_station || "–")};
      nederbörd: ${esc(kl.neder_station || "–")}. Källa: <a href="https://www.smhi.se/data" target="_blank" rel="noopener">SMHI</a>,
      CC BY 4.0, bearbetad. Hämtad ${esc(kl.hamtad)}.</div></div>`;
  const sp = p.spar;
  if (sp) h += `<div class="section"><h2>Spår inom ${n(sp.radie_m)} m</h2><table>
      ${rad("Spår totalt", "<b>" + n(sp.totalt_m) + " m</b>")}${rad("Huvudspår", n(sp.huvudspar) + " m")}${rad("Bangård", n(sp.bangard) + " m")}
      ${rad("Sidospår", n(sp.sidospar) + " m")}${rad("Anslutnings-/industrispår", n(sp.anslutningsspar) + " m")}
      ${rad("Varav elektrifierat", n(sp.elektrifierat_m) + " m")}</table>
      <div class="kalla">Spårlängd i OpenStreetMap (railway=rail) inom ${n(sp.radie_m)} m, uppdelad efter OSM:s spårtyp. Spårtyperna är
      frivilligt taggade och OSM är inte heltäckande; Trafikverkets järnvägsnät är den officiella källan. Hämtad ${esc(sp.hamtad)}
      via Overpass. ${ODBL}.</div></div>`;
  const rk = p.risk;
  if (rk) {
    // MCF-lager: true = karterat område inom 100 m. SGU-skred: avstånd i meter.
    const avst = m => m === null || m === undefined ? "Nej" : m === true ? "<b>Ja</b>, inom 100 m"
      : m === 0 ? "<b>Ja, punkten ligger i området</b>" : "<b>Ja</b>, ca " + n(m) + " m";
    h += `<div class="section"><h2>Naturrisker inom 100 m</h2><table>
      ${rad("Översvämning, 100-årsflöde", avst(rk.q100))}${rad("Översvämning, 200-årsflöde", avst(rk.q200))}
      ${rad("Översvämning, beräknat högsta flöde", avst(rk.bhf))}
      ${rad("Område med betydande översvämningsrisk", avst(rk.apsfr))}
      ${rad("Stabilitetskartering (skred/ras), MCF", avst(rk.stabilitet))}
      ${rad("Aktsamhetsområde för skred, SGU", avst(rk.sgu_skred))}
      ${rad("Jordart vid punkten", esc(rk.jordart || "–"))}</table>
      <div class="kalla">Källor: <a href="https://www.mcf.se/sv/verktyg--tjanster/oversvamningsportalen/" target="_blank" rel="noopener">MCF, översvämnings-
      och stabilitetskarteringar</a> · <a href="https://www.sgu.se" target="_blank" rel="noopener">SGU</a>, förutsättningar för skred i finkornig jordart (CC0)
      och jordarter 1:25 000–1:100 000. Hämtad ${esc(rk.hamtad)}. Karteringarna täcker inte hela Sverige, så "Nej" betyder att
      inget område är karterat inom 100 m, inte att risk saknas. Räknat från punkten, inte från fastighetsgränsen.</div></div>`;
  }
  const km = p.kulturmiljo;
  if (km) {
    const raaLank = (url, text) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);
    const avst = m => m === 0 ? "i objektet" : "ca " + n(m) + " m";
    h += `<div class="section"><h2>Kulturmiljö inom 250 m</h2>`;
    h += km.byggnadsminnen.length ? `<div style="margin-bottom:6px"><b>Byggnadsminnen</b><table>${km.byggnadsminnen.map(b =>
        `<tr><th>${raaLank(b.url, b.namn)}<div class="liten">${esc(b.skydd)}${b.beslutsdatum ? ", beslut " + esc(b.beslutsdatum) : ""}</div></th><td class="num">${avst(b.avstand_m)}</td></tr>`).join("")}</table></div>` : "";
    h += `<div style="margin-bottom:6px"><b>Kulturhistoriskt inventerad bebyggelse (${n(km.antal_bebyggelse)})</b>` + (km.bebyggelse.length
        ? `<table>${km.bebyggelse.map(b => `<tr><th>${raaLank(b.url, b.namn || b.nummer)}<div class="liten">${esc([b.andamal, b.skydd, b.tillkomst].filter(Boolean).join(" · "))}</div></th>
            <td class="num">${avst(b.avstand_m)}</td></tr>`).join("")}</table>${km.antal_bebyggelse > km.bebyggelse.length ? `<div class="liten">Visar de ${km.bebyggelse.length} närmaste.</div>` : ""}`
        : `<div class="muted">Ingen registrerad.</div>`) + `</div>`;
    h += `<div><b>Kulturhistoriska lämningar (${n(km.antal_lamningar)}, varav ${n(km.antal_fornlamningar)} fornlämningar)</b>` + (km.lamningar.length
        ? `<table>${km.lamningar.map(l => `<tr><th>${raaLank(l.url, l.namn || l.typ)}<div class="liten">${esc([l.bedomning, l.raa_nummer || l.nummer].filter(Boolean).join(" · "))}</div></th>
            <td class="num">${avst(l.avstand_m)}</td></tr>`).join("")}</table>${km.antal_lamningar > km.lamningar.length ? `<div class="liten">Visar de ${km.lamningar.length} närmaste.</div>` : ""}`
        : `<div class="muted">Inga registrerade.</div>`) + `</div>`;
    h += `<div class="kalla">Källa: <a href="https://www.raa.se/hitta-information/oppna-data/oppna-data-portal/" target="_blank" rel="noopener">Riksantikvarieämbetet, öppna data</a>
      (Kulturmiljöregistret och Bebyggelseregistret, CC0/CC BY). Hämtad ${esc(km.hamtad)}. Avstånd från punkten.
      RAÄ påpekar att kvaliteten kan variera; inför planering eller markarbeten ska länsstyrelsen kontaktas.</div></div>`;
  }
  return h;
}

function valj(id, zooma) {
  valdId = id;
  const f = data.features.find(x => x.properties.id === id), p = f.properties;
  rita();
  if (zooma && f.geometry) map.setView([f.geometry.coordinates[1], f.geometry.coordinates[0]], 16);
  const rad = (k, v) => `<tr><th>${esc(k)}</th><td class="num">${v}</td></tr>`;
  document.getElementById("detail").innerHTML = `<div class="section">
    <h2>${esc(p["Affärsområde"])}</h2>
    <div style="font-size:18px;font-weight:600">${esc(p.Fastighetsbeskrivning || p.Fastighetsbeteckning)}</div>
    <div class="muted">${esc(p.Kommun)} ${esc(p.Fastighetsbeteckning)}</div>
    <table style="margin-top:8px">
      <tr><th>Adress</th><td>${p.Adress ? esc(p.Adress) : '<span class="muted">–</span>'}</td></tr>
      ${rad("Lokalarea, summa (kvm)", "<b>" + kvm(p["Lokalarea Summa"]) + "</b>")}
      ${TYPER.map(t => rad(t + " (kvm)", kvm(p[t]))).join("")}
    </table>
    <div class="kalla">Källa: <a href="${esc(data.metadata.kalla_url)}" target="_blank" rel="noopener">${esc(data.metadata.kalla)}</a>, sida ${esc(p.pdf_sida)}.
      Tomma värden är tomma i förteckningen.</div></div>
    <div class="section"><h2>Läge på kartan</h2>
    ${f.geometry ? `<div>${esc(p.lage_metod)}</div><div class="kalla">${p.lage_flyttad_m !== undefined
      ? `Adressen träffade bara gatan (${esc(p.lage_osm)}), så punkten flyttades ca ${kvm(p.lage_flyttad_m)} m. ` : `Träff i OpenStreetMap: ${esc(p.lage_osm)}. `}
      Hämtad ${esc(p.lage_hamtad)} via Nominatim${(p.lage_metod || "").startsWith("Trafikverket") ? " och Trafikverkets stationsregister (CC0)" : ""}.
      © OpenStreetMap-bidragsgivare, ODbL.</div>`
      : `<div class="muted">Adressen kunde inte hittas i OpenStreetMap i rätt kommun, så fastigheten saknar punkt.</div>`}
    </div>
    ${f.geometry ? osmSektioner(p) : ""}
    <div class="section"><a href="#" id="tillbaka">← Om kartan, källor och licenser</a></div>`;
  document.getElementById("tillbaka").onclick = e => { e.preventDefault(); valdId = null; rita(); document.getElementById("detail").innerHTML = om(); };
}

// no-cache: kontrollera alltid mot servern, så att nya dataversioner syns direkt
fetch("fastigheter.geojson", { cache: "no-cache" }).then(r => r.json()).then(d => {
  data = d;
  const kommuner = [...new Set(d.features.map(f => f.properties.Kommun))].sort((a, b) => a.localeCompare(b, "sv"));
  document.getElementById("fKommun").innerHTML += kommuner.map(k => `<option>${esc(k)}</option>`).join("");
  document.getElementById("fOmr").innerHTML = Object.entries(OMR).map(([k, v]) =>
    `<label><input type="checkbox" value="${esc(k)}" checked> <span class="swatch" style="background:${css(v)}"></span>${esc(k)}
     <span class="muted">(${d.features.filter(f => f.properties["Affärsområde"] === k).length})</span></label>`).join("");
  document.getElementById("detail").innerHTML = om();
  document.querySelectorAll("#fOmr input, #fKommun").forEach(el => el.onchange = () => {
    const pts = rita();
    if (el.id === "fKommun" && pts.length) map.fitBounds(pts, { maxZoom: 14, padding: [40, 40] });
  });
  document.getElementById("fSok").oninput = rita;
  const sel = document.getElementById("fInd");
  sel.innerHTML = Object.entries(INDIKATORER).map(([k, I]) => `<option value="${k}">${esc(I.namn)}</option>`).join("");
  sel.onchange = () => { ind = sel.value; beraknaBrytpunkter(); rita(); };
  const pts = rita();
  if (pts.length) map.fitBounds(pts, { padding: [20, 20] });
}).catch(() => document.getElementById("detail").innerHTML =
  '<div class="section">Kunde inte läsa fastigheter.geojson. Sidan måste öppnas via en webbserver, t.ex. GitHub Pages.</div>');
</script>
</body>
</html>
