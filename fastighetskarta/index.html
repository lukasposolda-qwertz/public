<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jernhusens fastigheter – inofficiell karta</title>
<meta name="description" content="Inofficiell karta över Jernhusens fastighetsbestånd och det svenska järnvägsnätet, byggd på öppna data.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: rgba(16, 20, 28, .94); --panel-solid: #10141c; --line: rgba(255,255,255,.10);
    --text: #e8ecf2; --muted: #8b95a5; --rail: #f5a524; --accent: #3ee0c5; --depa: #ff7a59; --station: #6aa8ff;
    --risk: #ff6b6b; --hover: rgba(255,255,255,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 0; }
  a { color: var(--accent); }
  button, select, input { font: inherit; color: inherit; }

  /* Toppmeny */
  #topp { position: absolute; z-index: 5; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center;
          gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
  .titel { display: flex; flex-direction: column; margin-right: 4px; line-height: 1.2; }
  .titel b { font-size: 14px; letter-spacing: .01em; white-space: nowrap; }
  .titel span { font-size: 10px; color: #ffd27a; white-space: nowrap; }
  #ind { max-width: 210px; }
  .textknapp { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; padding: 5px 4px; text-decoration: none; white-space: nowrap; }
  .textknapp:hover { color: var(--text); }
  .falt { display: flex; align-items: center; gap: 6px; }
  .falt label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  input[type=search], select { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 6px;
                               padding: 5px 8px; color: var(--text); }
  select option { background: var(--panel-solid); }
  #sok { width: 150px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 5px 10px; cursor: pointer; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #0d1117; font-weight: 600; }
  .knapp { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
           cursor: pointer; font-size: 13px; white-space: nowrap; }
  .knapp:hover, .seg button:hover:not(.on) { background: var(--hover); }
  .knapp.on { border-color: var(--rail); color: var(--rail); }
  #platt.on { background: none; color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }
  .knapp:disabled { opacity: .45; cursor: default; }
  .hoger { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  /* Paneler */
  .panel { position: absolute; z-index: 3; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           backdrop-filter: blur(6px); overflow: auto; }
  #lista { left: 12px; width: 300px; }
  #kort { right: 12px; width: 380px; display: none; }
  #legend { left: 12px; bottom: 12px; width: 300px; padding: 10px 12px; font-size: 12px; color: var(--muted); }
  .phuvud { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  .phuvud b { font-size: 13px; }
  ol { list-style: none; margin: 0; padding: 4px 0; }
  li { display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; padding: 6px 14px; cursor: pointer; }
  li:hover, li.vald { background: var(--hover); }
  .nr { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; font-size: 12px; padding-top: 1px; }
  .meta { grid-column: 2; color: var(--muted); font-size: 12px; }
  .stapel { grid-column: 2; height: 3px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
  .stapel span { display: block; height: 100%; }
  .utan { color: var(--muted); font-size: 12px; padding: 8px 14px; border-top: 1px solid var(--line); }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
  .rail { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px;
          background: var(--rail); box-shadow: 0 0 6px var(--rail); }

  /* Kort */
  .sektion { padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .sektion h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 7px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 400; color: var(--muted); padding: 2px 0; vertical-align: top; }
  td { text-align: right; padding: 2px 0 2px 8px; font-variant-numeric: tabular-nums; vertical-align: top; }
  .stor { font-size: 22px; font-weight: 650; }
  .kalla { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .liten { color: var(--muted); font-size: 11px; }
  .ja { color: var(--risk); font-weight: 600; }
  .notis { background: rgba(255,210,122,.08); border: 1px solid rgba(255,210,122,.35); border-radius: 6px; padding: 8px 10px; }

  .maplibregl-ctrl-attrib { background: rgba(16,20,28,.85) !important; color: var(--muted); font-size: 11px; }
  .maplibregl-ctrl-attrib a { color: var(--text); }
  .maplibregl-ctrl-group { background: var(--panel-solid); } .maplibregl-ctrl-group button span { filter: invert(1); }

  @media (max-width: 900px) {
    /* En rad som scrollar i sidled i stället för fem staplade rader */
    #topp { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    #topp::-webkit-scrollbar { display: none; }
    #topp > * { flex: 0 0 auto; }
    .hoger { margin-left: 0; }
    #sok { width: 130px; }
    #lista { width: auto; right: 12px; max-height: 30vh !important; top: auto !important; bottom: 12px; }
    #legend { display: none; }
    #kort { left: 12px; right: 12px; width: auto; max-height: 55vh !important; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="topp">
  <div class="titel" title="Inofficiell demo, inte en tjänst från Jernhusen AB"><b>Jernhusens fastigheter</b><span>Inofficiell demo</span></div>
  <div class="falt"><input id="sok" type="search" placeholder="Sök kommun, namn" aria-label="Sök"></div>
  <div class="seg" id="omrval" role="group" aria-label="Affärsområde">
    <button data-o="" class="on">Alla</button><button data-o="Stationer">Stationer</button><button data-o="Depåer och kombiterminaler">Depåer</button>
  </div>
  <div class="falt"><select id="ind" aria-label="Färga punkterna efter" title="Färga punkterna efter"></select></div>
  <div class="seg" id="kartval" role="group" aria-label="Bakgrundskarta">
    <button data-k="mork" class="on">Mörk</button><button data-k="ljus">Ljus</button><button data-k="detalj" title="Vanlig karta med alla detaljer">Standard</button><button data-k="foto">Flygfoto</button>
  </div>
  <button class="knapp on" id="sparknapp" aria-pressed="true">Spår</button>
  <div class="hoger">
    <div class="seg" role="group" aria-label="Vy">
      <button id="platt" title="Räta upp kartan här: ingen lutning, norr uppåt, samma zoom">⟂ Platt</button>
      <button id="sverige" title="Platt översikt över hela Sverige">Hela Sverige</button>
    </div>
    <a class="textknapp" href="jamforelse.html">Jämförelse</a>
    <button class="textknapp" id="omknapp">Om och källor</button>
  </div>
</div>

<div id="lista" class="panel">
  <div class="phuvud"><b>Fastigheter</b><span class="liten" id="antal"></span></div>
  <ol id="fastlista"></ol>
</div>
<div id="kort" class="panel"></div>
<div id="legend" class="panel"></div>

<script>
// ---- hjälp ---------------------------------------------------------------------------
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const n = v => v === null || v === undefined || Number.isNaN(v) ? "–" : Number(v).toLocaleString("sv-SE", { maximumFractionDigits: 1 });
const rad = (k, v) => `<tr><th>${esc(k)}</th><td>${v}</td></tr>`;
const ODBL = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-bidragsgivare, ODbL';
const osmLank = (id, text) => `<a href="https://www.openstreetmap.org/${esc(id)}" target="_blank" rel="noopener">${esc(text || id)}</a>`;
const PDF_URL = "https://www.datocms-assets.com/163536/1772552927-fastighetsforteckning-2025-1.pdf";
const SVERIGE = { center: [16.5, 62.3], zoom: 4.3, pitch: 0, bearing: 0 };
const TYPER = ["Handel/Butik", "Hotell", "Industri/Depå", "Kontor", "Lager/Förråd", "Restaurang/Café", "Stationsverksamhet", "Övrigt"];

// ---- bakgrundskartor -----------------------------------------------------------------
const OFM = "https://tiles.openfreemap.org";
const FLYGFOTO = {
  version: 8, glyphs: `${OFM}/fonts/{fontstack}/{range}.pbf`,
  sources: {
    esri: { type: "raster", tileSize: 256, maxzoom: 19,
            tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
            attribution: 'Flygfoto: <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a>, Maxar, Earthstar Geographics och GIS-användarsamfundet' },
    openmaptiles: { type: "vector", url: `${OFM}/planet` },
  },
  layers: [{ id: "flygfoto", type: "raster", source: "esri" }],
};
const KARTOR = {
  mork:   { stil: `${OFM}/styles/dark`,     hus: "#3a4250", rail: "#f5a524", text: "#e8ecf2", halo: "#0d1117" },
  ljus:   { stil: `${OFM}/styles/positron`, hus: "#d5dae1", rail: "#d97706", text: "#1d2430", halo: "#ffffff" },
  detalj: { stil: `${OFM}/styles/liberty`,  hus: "#d9d0c9", rail: "#c2410c", text: "#1d2430", halo: "#ffffff" },
  foto:   { stil: FLYGFOTO,                 hus: null,      rail: "#ffb703", text: "#ffffff", halo: "#000000" },
};
let karta = "mork", sparPa = true;

// ---- indikatorer för färgläggning ------------------------------------------------------
const RAMP = ["#c7e9f1", "#7fcbe0", "#3ea6cf", "#1f78b4", "#0b3d6e"];
const SAKNAS = "#7a828f";
const OMR = { "Stationer": "--station", "Depåer och kombiterminaler": "--depa" };
const jaNej = (v, ja = "#ff6b6b") => ({ "Ja": ja, "Nej": "#5b6472" });
const IND = {
  omr:     { namn: "Affärsområde", kat: p => p["Affärsområde"], farger: () => Object.fromEntries(Object.entries(OMR).map(([k, v]) => [k, css(v)])) },
  tag:     { namn: "Tågavgångar per vardag", num: p => p.trafik?.avgangar.tag, kalla: "Trafiklab" },
  tagtim:  { namn: "Flest tåg under en timme", num: p => p.trafik?.tag_max_per_timme, kalla: "Trafiklab" },
  buss:    { namn: "Bussavgångar per vardag", num: p => p.trafik?.avgangar.buss, kalla: "Trafiklab" },
  bef:     { namn: "Invånare inom 1 km", num: p => p.befolkning?.inom_1km, kalla: "SCB" },
  syss:    { namn: "Sysselsättningsgrad (DeSO)", num: p => p.demografi?.sysselsattning_20_64, kalla: "SCB", enhet: "%" },
  ink:     { namn: "Nettoinkomst (DeSO)", num: p => p.demografi?.nettoinkomst_tkr, kalla: "SCB", enhet: "tkr" },
  service: { namn: "Butiker, mat och service inom 500 m", num: p => p.service_500m && (p.service_500m.butiker + p.service_500m.mat_dryck + p.service_500m.service), kalla: "OpenStreetMap" },
  spar:    { namn: "Spårlängd inom 300 m", num: p => p.spar?.totalt_m, kalla: "OpenStreetMap", enhet: "m" },
  temp:    { namn: "Årsmedeltemperatur", num: p => p.klimat?.arsmedel_temp, kalla: "SMHI", enhet: "°C" },
  neder:   { namn: "Årsnederbörd", num: p => p.klimat?.arsnederbord_mm, kalla: "SMHI", enhet: "mm" },
  flod:    { namn: "Översvämning inom 100 m", kat: p => p.risk ? (p.risk.q100 ? "100-årsflöde" : p.risk.bhf ? "Bara högsta flöde" : "Nej") : null,
             farger: () => ({ "100-årsflöde": "#ff6b6b", "Bara högsta flöde": "#f5a524", "Nej": "#5b6472" }), kalla: "MCF" },
  skred:   { namn: "Skred/stabilitet inom 100 m", kat: p => p.risk ? ((p.risk.sgu_skred !== null || p.risk.stabilitet) ? "Ja" : "Nej") : null, farger: () => jaNej(), kalla: "SGU, MCF" },
  natur:   { namn: "Skyddad natur inom 500 m", kat: p => p.skyddad_natur ? (p.skyddad_natur.omraden.length ? "Ja" : "Nej") : null, farger: () => jaNej("#4ade80"), kalla: "Naturvårdsverket" },
  lamn:    { namn: "Kulturhistoriska lämningar inom 250 m", num: p => p.kulturmiljo?.antal_lamningar, kalla: "RAÄ" },
  bminne:  { namn: "Byggnadsminne inom 250 m", kat: p => p.kulturmiljo ? (p.kulturmiljo.byggnadsminnen.length ? "Ja" : "Nej") : null, farger: () => jaNej("#e9a873"), kalla: "RAÄ" },
};
let ind = "omr", brytpunkter = [], minVarde = 0;
function beraknaBryt() {
  const I = IND[ind]; brytpunkter = [];
  if (!I.num) return;
  const v = data.features.map(f => I.num(f.properties)).filter(x => x !== null && x !== undefined).sort((a, b) => a - b);
  minVarde = v[0];
  brytpunkter = [...new Set([1, 2, 3, 4].map(i => v[Math.floor(i * v.length / 5)]))].filter(b => b > minVarde);
}
const klassFarg = i => RAMP[brytpunkter.length ? Math.round(i * 4 / brytpunkter.length) : 2];
function farg(p) {
  const I = IND[ind];
  if (I.kat) { const k = I.kat(p); return k === null || k === undefined ? SAKNAS : (I.farger()[k] || SAKNAS); }
  const x = I.num(p);
  return x === null || x === undefined ? SAKNAS : klassFarg(brytpunkter.filter(b => x >= b).length);
}
function ritaLegend() {
  const I = IND[ind], heltal = !I.enhet || I.enhet === "m" || I.enhet === "mm";
  const f = x => heltal ? Math.round(x).toLocaleString("sv-SE") : Number(x).toLocaleString("sv-SE", { maximumFractionDigits: 1 });
  const e = I.enhet ? " " + I.enhet : "";
  const sw = c => `<span class="sw" style="background:${c}"></span>`;
  let h = `<div style="color:var(--text);font-weight:600;margin-bottom:4px">${esc(I.namn)}</div>`;
  h += I.kat ? Object.entries(I.farger()).map(([k, c]) => `<div>${sw(c)}${esc(k)}</div>`).join("")
    : [minVarde, ...brytpunkter].map((fr, i) => {
        const till = i < brytpunkter.length ? brytpunkter[i] : null;
        const t = till === null ? f(fr) + e + " och mer" : heltal ? (fr === till - 1 ? f(fr) : f(fr) + "–" + f(till - 1)) + e : f(fr) + " till under " + f(till) + e;
        return `<div>${sw(klassFarg(i))}${t}</div>`; }).join("");
  if (ind !== "omr") h += `<div>${sw(SAKNAS)}Uppgift saknas</div><div style="margin-top:3px">Källa: ${esc(I.kalla)}</div>`;
  h += `<div style="margin-top:8px">Punktens storlek visar lokalarean.</div>`;
  h += `<div style="margin-top:4px"><span class="rail"></span>Järnväg, huvud- och bandelar (OSM)</div>`;
  h += `<div><span class="sw" style="background:var(--accent);border-radius:2px"></span>Byggnad kopplad till fastigheten (OSM)</div>`;
  document.getElementById("legend").innerHTML = h;
}

// ---- karta -----------------------------------------------------------------------------
const map = new maplibregl.Map({
  container: "map", style: KARTOR[karta].stil, ...SVERIGE, maxPitch: 75,
  attributionControl: { compact: true, customAttribution:
    'Fastigheter: Jernhusen AB, fastighetsförteckning 2025-12-31 · © OpenStreetMap-bidragsgivare (ODbL) · fler källor under "Om och källor"' },
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");

let data, dataJarnvag, dataBygg, valdId = null, omrFilter = "";
let valdaBasId = [];             // bakgrundskartans byggnads-id för byggnader kopplade till fastigheterna

function egnaLager() {
  const K = KARTOR[karta];
  document.documentElement.style.setProperty("--rail", K.rail);
  // Bakgrundens byggnader i 3D. Kopplade byggnader färgas i bakgrundens EGEN byggnad (id = OSM-id*10+2),
  // så att form och höjd blir exakt rätt. "Detaljerad karta" har egna 3D-hus som tas bort och ersätts.
  if (map.getLayer("building-3d")) map.removeLayer("building-3d");
  if (map.getSource("openmaptiles")) {
    const vald = ["in", ["id"], ["literal", valdaBasId.filter(x => x.f === valdId).map(x => x.id)]];
    const kopplad = ["in", ["id"], ["literal", valdaBasId.map(x => x.id)]];
    map.addLayer({ id: "hus-3d", type: "fill-extrusion", source: "openmaptiles", "source-layer": "building", minzoom: 13,
      ...(K.hus ? {} : { filter: kopplad }),           // över flygfoto ritas bara de kopplade byggnaderna
      paint: { "fill-extrusion-color": ["case", vald, "#a7fff0", kopplad, css("--accent"), K.hus || "#ffffff"],
               "fill-extrusion-opacity": 0.9,
               "fill-extrusion-height": ["coalesce", ["get", "render_height"], 6],
               "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0] } });
  }
  map.addSource("jarnvag", { type: "geojson", data: dataJarnvag });
  const huvud = ["case", ["==", ["get", "usage"], "main"], 1, 0.6];
  const bredd = (a, b) => ["interpolate", ["linear"], ["zoom"], 4, ["*", huvud, a], 10, ["*", huvud, b], 15, ["*", huvud, b * 2.5]];
  const synl = sparPa ? "visible" : "none";
  map.addLayer({ id: "jarnvag-glod", type: "line", source: "jarnvag", layout: { "line-cap": "round", "line-join": "round", visibility: synl },
    paint: { "line-color": K.rail, "line-opacity": 0.25, "line-blur": 3, "line-width": bredd(4, 9) } });
  map.addLayer({ id: "jarnvag", type: "line", source: "jarnvag", layout: { "line-cap": "round", "line-join": "round", visibility: synl },
    paint: { "line-color": K.rail, "line-opacity": ["case", ["==", ["get", "usage"], "main"], 0.95, 0.6], "line-width": bredd(0.9, 2.2) } });
  map.addSource("fast", { type: "geojson", data: data });
  const radie = ["interpolate", ["linear"], ["zoom"], 4, ["+", 3, ["/", ["sqrt", ["get", "Lokalarea Summa"]], 40]],
                 12, ["+", 6, ["/", ["sqrt", ["get", "Lokalarea Summa"]], 18]]];
  map.addLayer({ id: "fast", type: "circle", source: "fast", paint: {
    "circle-radius": radie, "circle-color": ["get", "_farg"], "circle-opacity": 0.95,
    "circle-stroke-color": ["case", ["==", ["get", "id"], valdId || ""], "#ffffff", "rgba(255,255,255,.65)"],
    "circle-stroke-width": ["case", ["==", ["get", "id"], valdId || ""], 3, 1.2] } });
  map.addLayer({ id: "fast-namn", type: "symbol", source: "fast", minzoom: 9, layout: {
    "text-field": ["get", "Fastighetsbeskrivning"], "text-font": ["Noto Sans Regular"], "text-size": 12,
    "text-offset": [0, 1.3], "text-anchor": "top", "text-optional": true },
    paint: { "text-color": K.text, "text-halo-color": K.halo, "text-halo-width": 1.5 } });
}

function fargaPunkter() {
  beraknaBryt();
  for (const f of data.features) f.properties._farg = farg(f.properties);
  if (map.getSource("fast")) map.getSource("fast").setData(data);
  ritaLegend(); ritaLista();
}

map.on("style.load", async () => {
  if (!data) {
    [dataJarnvag, dataBygg, data] = await Promise.all(["jarnvag.geojson", "byggnader.geojson", "karta.geojson"]
      .map(u => fetch(u, { cache: "no-cache" }).then(r => r.json())));
    valdaBasId = dataBygg.features.map(b => ({ id: b.properties.basid, f: b.properties.fastighet }));
    document.getElementById("ind").innerHTML = Object.entries(IND).map(([k, I]) => `<option value="${k}">Färga: ${esc(I.namn)}</option>`).join("");
    fargaPunkter();
    visaOm();
  }
  egnaLager();
  filtrera();
  placeraPaneler();
});
map.on("click", "fast", e => valj(e.features[0].properties.id));
map.on("mouseenter", "fast", () => map.getCanvas().style.cursor = "pointer");
map.on("mouseleave", "fast", () => map.getCanvas().style.cursor = "");
// Platt-knappen markeras när kartan är lutad eller vriden, så att det syns att den gör något
const uppdateraPlatt = () => document.getElementById("platt").classList.toggle("on", map.getPitch() >= 1 || Math.abs(map.getBearing()) >= 1);
map.on("pitchend", uppdateraPlatt); map.on("rotateend", uppdateraPlatt); map.on("moveend", uppdateraPlatt);

function markeraVald() {
  if (map.getLayer("fast")) {
    map.setPaintProperty("fast", "circle-stroke-color", ["case", ["==", ["get", "id"], valdId || ""], "#ffffff", "rgba(255,255,255,.65)"]);
    map.setPaintProperty("fast", "circle-stroke-width", ["case", ["==", ["get", "id"], valdId || ""], 3, 1.2]);
  }
  if (map.getLayer("hus-3d")) {
    const K = KARTOR[karta];
    const vald = ["in", ["id"], ["literal", valdaBasId.filter(x => x.f === valdId).map(x => x.id)]];
    const kopplad = ["in", ["id"], ["literal", valdaBasId.map(x => x.id)]];
    map.setPaintProperty("hus-3d", "fill-extrusion-color", ["case", vald, "#a7fff0", kopplad, css("--accent"), K.hus || "#ffffff"]);
  }
}

// ---- lista och filter ------------------------------------------------------------------
function urval() {
  const s = document.getElementById("sok").value.trim().toLowerCase();
  return data.features.filter(({ properties: p }) => (!omrFilter || p["Affärsområde"] === omrFilter) &&
    (!s || [p.Kommun, p.Fastighetsbeskrivning, p.Fastighetsbeteckning, p.Adress].join(" ").toLowerCase().includes(s)));
}
function ritaLista() {
  const fs = urval(), maxLoa = Math.max(...data.features.map(f => f.properties["Lokalarea Summa"] || 0));
  document.getElementById("antal").textContent = `${fs.length} av ${data.features.length} med läge`;
  const s = document.getElementById("sok").value.trim();
  document.getElementById("fastlista").innerHTML = fs.map(({ properties: p }) => `
    <li data-id="${esc(p.id)}" class="${p.id === valdId ? "vald" : ""}"><span class="nr">${p.rank}</span>
      <span><span class="sw" style="background:${p._farg}"></span>${esc(p.Fastighetsbeskrivning || p.Fastighetsbeteckning)}</span>
      <span class="meta">${esc(p.Kommun)} · ${n(p["Lokalarea Summa"])} kvm</span>
      <span class="stapel"><span style="width:${100 * (p["Lokalarea Summa"] || 0) / maxLoa}%;background:${css(OMR[p["Affärsområde"]])}"></span></span></li>`).join("") +
    (data.utan_lage?.length && !s && !omrFilter ? `<li class="utan" style="display:block;cursor:default">Saknar läge och visas inte på kartan:
      ${data.utan_lage.map(u => esc(u.namn || u.beteckning) + " (" + esc(u.kommun) + ")").join(", ")}.</li>` : "");
  document.querySelectorAll("#fastlista li[data-id]").forEach(li => li.onclick = () => valj(li.dataset.id));
}
function filtrera() {
  ritaLista();
  if (!map.getLayer("fast")) return;
  const f = ["in", ["get", "id"], ["literal", urval().map(f => f.properties.id)]];
  map.setFilter("fast", f); map.setFilter("fast-namn", f);
}
document.getElementById("sok").oninput = filtrera;
document.querySelectorAll("#omrval button").forEach(b => b.onclick = () => {
  omrFilter = b.dataset.o;
  document.querySelectorAll("#omrval button").forEach(x => x.classList.toggle("on", x === b));
  filtrera();
});
document.getElementById("ind").onchange = e => { ind = e.target.value; fargaPunkter(); filtrera(); };
// Kort indikatornamn i menyn ("Färga: …"), hela namnet i teckenförklaringen

// ---- knappar ---------------------------------------------------------------------------
document.querySelectorAll("#kartval button").forEach(b => b.onclick = () => {
  if (b.dataset.k === karta) return;
  karta = b.dataset.k;
  document.querySelectorAll("#kartval button").forEach(x => x.classList.toggle("on", x === b));
  map.setStyle(KARTOR[karta].stil, { diff: false });
});
document.getElementById("sparknapp").onclick = e => {
  sparPa = !sparPa;
  e.currentTarget.classList.toggle("on", sparPa); e.currentTarget.setAttribute("aria-pressed", sparPa);
  for (const id of ["jarnvag", "jarnvag-glod"]) if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", sparPa ? "visible" : "none");
};
// Platt: räta upp där man är (samma centrum och zoom). Hela Sverige: platt översikt.
document.getElementById("platt").onclick = () => map.easeTo({ pitch: 0, bearing: 0, duration: 1000 });
document.getElementById("sverige").onclick = () => {
  valdId = null; markeraVald(); ritaLista(); visaOm();
  map.flyTo({ ...SVERIGE, duration: 2500 });
};
document.getElementById("omknapp").onclick = () => { valdId = null; markeraVald(); ritaLista(); visaOm(); };

// Panelerna börjar under toppmenyn, vars höjd beror på fönsterbredden
function placeraPaneler() {
  const h = document.getElementById("topp").getBoundingClientRect().height + 12;
  const leg = document.getElementById("legend");
  const legH = getComputedStyle(leg).display === "none" ? 0 : leg.getBoundingClientRect().height + 24;
  const lista = document.getElementById("lista"), kort = document.getElementById("kort");
  lista.style.top = h + "px"; lista.style.maxHeight = `calc(100% - ${h + legH}px)`;
  kort.style.top = h + "px"; kort.style.maxHeight = `calc(100% - ${h + 12}px)`;
}
window.addEventListener("resize", placeraPaneler);

// ---- kort: om och källor ---------------------------------------------------------------
function visaOm() {
  const k = document.getElementById("kort");
  k.innerHTML = `<div class="phuvud"><b>Om kartan</b><button class="knapp" id="stang">Stäng</button></div>
    <div class="sektion"><p class="notis" style="margin-top:0">Inofficiell demo, gjord som ett privat projekt. Inte framtagen av eller för
      Jernhusen AB och ersätter inte bolagets egna uppgifter.</p>
    <p>Kartan visar fastigheterna i Jernhusens publicerade <a href="${PDF_URL}" target="_blank" rel="noopener">fastighetsförteckning
      per 2025-12-31</a>. Varje punkt är ett ungefärligt läge, framtaget från adressen i förteckningen och förbättrat med
      Trafikverkets stationslägen och namngivna depåer i OpenStreetMap. Punkten är inte fastighetens gräns.</p>
    <p>Klicka på en fastighet för att se uppgifterna och flyga in i 3D. <b>Platt</b> rätar upp kartan där du är;
      <b>Hela Sverige</b> visar översikten igen. Under <b>Färga</b> väljer du
      vilken uppgift punkterna färgas efter. Alla avstånd räknas från punkten.</p>
    <p class="liten">Fastighetsgränser och energideklarationer finns inte med: Lantmäteriets och Boverkets villkor tillåter inte att de
      publiceras öppet. Turkosa byggnader är byggnader i OpenStreetMap som kopplats till fastigheten (på adressen, med samma namn,
      stationsbyggnader intill eller byggnader på depåmark). Det är en uppskattning, inte uppgift om ägande.</p></div>
    <div class="sektion"><h2>Källor och licenser</h2><ul style="padding-left:18px;margin:0" class="liten">
      <li>Fastighetsdata: Jernhusen AB, fastighetsförteckning 2025-12-31. © Jernhusen AB.</li>
      <li>Lägen, byggnader, stationer, service, spår, järnvägsnät: © OpenStreetMap-bidragsgivare (Nominatim, Overpass). ODbL 1.0.</li>
      <li>Stationslägen: Trafikverket, stationsregister. CC0.</li>
      <li>Kollektivtrafik: GTFS Sverige 2, Samtrafiken via <a href="https://www.trafiklab.se/api/gtfs-datasets/gtfs-sverige-2/" target="_blank" rel="noopener">Trafiklab</a>. CC0.</li>
      <li>Befolkning (1 km-rutor) och DeSO-statistik: <a href="https://www.scb.se" target="_blank" rel="noopener">SCB</a>. Källa: SCB.</li>
      <li>Klimat 1991–2020: <a href="https://www.smhi.se/data" target="_blank" rel="noopener">SMHI</a>. CC BY 4.0, bearbetad.</li>
      <li>Skyddad natur: Naturvårdsverket, Naturvårdsregistret. CC0.</li>
      <li>Översvämning och stabilitet: <a href="https://www.mcf.se/sv/verktyg--tjanster/oversvamningsportalen/" target="_blank" rel="noopener">MCF</a>. Skred och jordart: <a href="https://www.sgu.se" target="_blank" rel="noopener">SGU</a>, CC0.</li>
      <li>Kulturmiljö: <a href="https://www.raa.se/hitta-information/oppna-data/oppna-data-portal/" target="_blank" rel="noopener">Riksantikvarieämbetet</a>. CC0/CC BY.</li>
      <li>Bakgrundskartor: <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> (© OpenMapTiles, data från OpenStreetMap); flygfoto: Esri.</li>
      <li>Kartbibliotek: <a href="https://maplibre.org" target="_blank" rel="noopener">MapLibre GL JS</a> (BSD-3). Kod: MIT, © 2026 Lukas Posolda.</li>
    </ul><p class="kalla">Metoder och detaljer i <a href="README.md">README</a>. Data sammanställd ${esc(data?.metadata?.skapad || "")}.</p></div>`;

// ---- kort: fastighet ---------------------------------------------------------------------
function valj(id) {
  const f = data.features.find(x => x.properties.id === id), p = f.properties;
  valdId = id; markeraVald(); ritaLista();
  map.flyTo({ center: f.geometry.coordinates, zoom: 16, pitch: 60, bearing: ((p.rank * 37) % 120) - 60, duration: 3000, essential: true });
  const k = document.getElementById("kort");
  k.innerHTML = kortHtml(p); k.style.display = "block"; k.scrollTop = 0;
  document.getElementById("stang").onclick = () => { k.style.display = "none"; };
}

function kortHtml(p) {
  const typer = TYPER.filter(t => p[t]).map(t => rad(t, n(p[t]) + " kvm")).join("");
  const byg = dataBygg.features.filter(b => b.properties.fastighet === p.id);
  const urv = { adress: "byggnaden på adressen", namn: "samma namn", station: "stationsbyggnad intill", jarnvagsmark: "på depåmark" };
  let h = `<div class="phuvud" style="display:block"><div class="liten">#${p.rank} · ${esc(p["Affärsområde"])}</div>
    <div style="font-size:19px;font-weight:650;margin:2px 0">${esc(p.Fastighetsbeskrivning || p.Fastighetsbeteckning)}</div>
    <div class="liten">${esc(p.Kommun)} ${esc(p.Fastighetsbeteckning)}${p.Adress ? " · " + esc(p.Adress) : ""}</div>
    <div style="margin-top:8px"><button class="knapp" id="stang">Stäng</button></div></div>`;
  h += `<div class="sektion"><h2>Lokalarea</h2><div class="stor">${n(p["Lokalarea Summa"])} kvm</div>
    <table style="margin-top:6px">${typer}</table>
    <div class="kalla">Jernhusens <a href="${PDF_URL}" target="_blank" rel="noopener">fastighetsförteckning 2025-12-31</a>, sida ${esc(p.pdf_sida)}.</div></div>`;
  h += `<div class="sektion"><h2>Byggnader (${byg.length})</h2>` + (byg.length
    ? `<table>${byg.map(b => rad(b.properties.namn || "Byggnad", `${osmLank(b.properties.osm, "OSM")} · ${esc(urv[b.properties.urval] || "")}`)).join("")}</table>`
    : `<div class="liten">Ingen byggnad kunde kopplas till fastigheten.</div>`) +
    `<div class="kalla">Byggnader i OpenStreetMap kopplade till fastigheten, turkosa på kartan. En uppskattning, inte uppgift om ägande. ${ODBL}.</div></div>`;
  const t = p.trafik;
  if (t) h += `<div class="sektion"><h2>Kollektivtrafik inom 500 m, en vardag</h2><table>
    ${rad("Tågavgångar", "<b>" + n(t.avgangar.tag) + "</b>")}${t.avgangar.tag ? rad("Flest tåg på en timme", n(t.tag_max_per_timme)) + rad("Första / sista tåg", esc(t.tag_forsta) + " – " + esc(t.tag_sista)) : ""}
    ${rad("Bussavgångar", n(t.avgangar.buss))}${rad("Spårvagn och tunnelbana", n(t.avgangar.sparvag_tunnelbana))}${t.avgangar.bat ? rad("Båt", n(t.avgangar.bat)) : ""}</table>
    ${t.tag_operatorer.length ? `<div class="liten" style="margin-top:4px">Tågoperatörer: ${esc(t.tag_operatorer.join(", "))}</div>` : ""}
    <div class="kalla">Planerad trafik ${esc(t.referensdag)}, GTFS Sverige 2 (version ${esc(t.gtfs_version)}), Samtrafiken via Trafiklab, CC0.
    En tur räknas en gång även om den stannar vid flera hållplatser.</div></div>`;
  const s = p.osm_station;
  h += `<div class="sektion"><h2>Närmaste järnvägsstation</h2>` + (s
    ? `<table>${rad(s.namn, "ca " + n(s.avstand_m) + " m")}</table><div class="kalla">${osmLank(s.osm, "Visa i OSM")}. ${ODBL}.</div>`
    : `<div class="liten">Ingen station inom 500 m i OpenStreetMap.</div>`) + `</div>`;
  const b = p.befolkning, dm = p.demografi, sv = p.service_500m;
  if (b || dm || sv) h += `<div class="sektion"><h2>Omgivning</h2><table>
    ${b ? rad("Invånare inom 1 km (ca)", n(b.inom_1km)) : ""}
    ${dm ? rad("Sysselsättningsgrad 20–64 år, DeSO", n(dm.sysselsattning_20_64) + " %") + rad("Nettoinkomst, medel, DeSO", n(dm.nettoinkomst_tkr) + " tkr")
         + rad("… kommunen / riket", n(dm.nettoinkomst_kommun_tkr) + " / " + n(dm.nettoinkomst_riket_tkr) + " tkr")
         + rad("Låg / hög ekonomisk standard", n(dm.lag_ek_standard) + " / " + n(dm.hog_ek_standard) + " %") : ""}
    ${sv ? rad("Butiker / mat och dryck inom 500 m", n(sv.butiker) + " / " + n(sv.mat_dryck)) + rad("Busshållplatser / cykelparkering", n(sv.busshallplatser) + " / " + n(sv.cykelparkering)) : ""}</table>
    <div class="kalla">SCB: 1 km-rutor 2025 och DeSO ${esc(dm?.deso || "")} år ${esc(dm?.ar || "")} (de boende, inte de som arbetar där).
    Service: OpenStreetMap, ett minimum. ${ODBL}.</div></div>`;
  const kl = p.klimat;
  if (kl) h += `<div class="sektion"><h2>Klimat ${esc(kl.period)}</h2><table>
    ${rad("Årsmedeltemperatur", n(kl.arsmedel_temp) + " °C")}${rad("Januari / juli", n(kl.jan_temp) + " / " + n(kl.jul_temp) + " °C")}${rad("Årsnederbörd", n(kl.arsnederbord_mm) + " mm")}</table>
    <div class="kalla">Normalvärden ur SMHI:s månadsvärden. Temperatur: ${esc(kl.temp_station || "–")}; nederbörd: ${esc(kl.neder_station || "–")}.
    SMHI, CC BY 4.0, bearbetad.</div></div>`;
  const sp = p.spar;
  if (sp) h += `<div class="sektion"><h2>Spår inom ${n(sp.radie_m)} m</h2><table>
    ${rad("Totalt", "<b>" + n(sp.totalt_m) + " m</b>")}${rad("Huvudspår / bangård", n(sp.huvudspar) + " / " + n(sp.bangard) + " m")}
    ${rad("Sidospår / anslutningsspår", n(sp.sidospar) + " / " + n(sp.anslutningsspar) + " m")}${rad("Elektrifierat", n(sp.elektrifierat_m) + " m")}</table>
    <div class="kalla">OpenStreetMap railway=rail, spårtyp enligt OSM:s taggning. ${ODBL}.</div></div>`;
  const rk = p.risk;
  if (rk) {
    const j = v => v === null || v === undefined || v === false ? "Nej" : `<span class="ja">Ja</span>`;
    h += `<div class="sektion"><h2>Naturrisker inom 100 m</h2><table>
      ${rad("Översvämning, 100-årsflöde", j(rk.q100))}${rad("Översvämning, 200-årsflöde", j(rk.q200))}${rad("Översvämning, högsta flöde", j(rk.bhf))}
      ${rad("Stabilitetskartering (MCF)", j(rk.stabilitet))}${rad("Aktsamhetsområde skred (SGU)", j(rk.sgu_skred))}${rad("Jordart", esc(rk.jordart || "–"))}</table>
      <div class="kalla">MCF och SGU (CC0). "Nej" betyder att inget är karterat inom 100 m, inte att risk saknas.</div></div>`;
  }
  const nat = p.skyddad_natur;
  if (nat) h += `<div class="sektion"><h2>Skyddad natur inom 500 m</h2>` + (nat.omraden.length
    ? `<table>${nat.omraden.map(o => rad(o.namn + " (" + o.skyddstyp + ")", o.avstand_m === 0 ? "i området" : "ca " + n(o.avstand_m) + " m")).join("")}</table>`
    : `<div class="liten">Inga gällande skyddade områden.</div>`) + `<div class="kalla">Naturvårdsverket, Naturvårdsregistret, CC0.</div></div>`;
  const km = p.kulturmiljo;
  if (km) {
    const lank = (u, t) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>` : esc(t);
    h += `<div class="sektion"><h2>Kulturmiljö inom 250 m</h2><table>
      ${km.byggnadsminnen.map(x => rad("Byggnadsminne", lank(x.url, x.namn))).join("")}
      ${rad("Inventerad bebyggelse", n(km.antal_bebyggelse))}${rad("Kulturhistoriska lämningar", n(km.antal_lamningar) + " (varav " + n(km.antal_fornlamningar) + " fornlämningar)")}</table>
      <div class="kalla">Riksantikvarieämbetet, öppna data. Kvaliteten kan variera; kontakta länsstyrelsen inför markarbeten.</div></div>`;
  }
  h += `<div class="sektion"><h2>Läge</h2><div>${esc(p.lage_metod)}</div>
    <div class="kalla">${p.lage_flyttad_m !== undefined ? `Adressen träffade bara gatan, så punkten flyttades ca ${n(p.lage_flyttad_m)} m. ` : ""}
    Punkten är ungefärlig och visar inte fastighetens gräns.</div></div>`;
  return h;
}
</script>
