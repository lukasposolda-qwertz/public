  {

      { t: "Det fångar energi från solljuset", c: false },
      { t: "Det innehåller cellens arvsanlag", c: false },
      { t: "Det ger cellen en stadig och nästan fyrkantig form", c: false }

    fb: "Cellmembranet fungerar som cellens ”portvakt” och avgör vilka ämnen som släpps in och ut. Alla celler har ett cellmembran. Solljuset fångas av klorofyllkornen i växtceller, och arvsanlagen finns i cellkärnan. Den stadiga, ofta fyrkantiga formen hos växtceller kommer från cellväggen, som sitter utanför cellmembranet."
  },
  {
    q: "Vilka egenskaper har alla levande varelser?",
    type: "multi",
    opts: [
      { t: "De består alltid av en eller flera celler", c: true },
      { t: "De behöver energi", c: true },
      { t: "De kan förflytta sig från en plats till en annan", c: false },

    fb: "A, B och D stämmer. Alla levande varelser består av celler, behöver energi och reagerar på sin omgivning. De kan också fortplanta sig, ta upp ämnen och ge ifrån sig ämnen. Att kunna förflytta sig är däremot inget krav: en ek eller en svamp står still hela livet men lever ändå. Även en växt reagerar på omgivningen, till exempel genom att vända bladen mot ljuset."
  },
  {
    q: "Vilken grupp hör varje organism till?",
    type: "match",
    badge: "Sortera – välj grupp för varje organism",
    choices: ["Bakterier", "Växter", "Svampar", "Djur"],
    rows: [
      { t: "Bacill", ans: "Bakterier" },
      { t: "Korall", ans: "Djur" },
      { t: "Mögel", ans: "Svampar" },

    fb: "Baciller och streptokocker är bakterier: encelliga och utan cellkärna. Mögel och jäst är svampar, som saknar klorofyll och lever på färdig näring. Mossa och ek är växter med klorofyll. Korallen och havstulpanen är djur, trots att de sitter fast och kan likna växter. En havstulpan är faktiskt ett kräftdjur som sitter fast på stenar och fångar mat med sina ben."
  },
  {
    q: "En enda bakterie hamnar på en odlingsplatta och förökar sig tills det har bildats en synlig prick av miljontals bakterier. Vad kallas en sådan samling bakterier?",

    parts: [{ label: "Svar", ans: ["koloni", "kolonier", "kolonin", "bakteriekoloni"], show: "koloni" }],
    fb: "En sådan samling kallas koloni. En enskild bakterie är för liten för att synas, men efter något dygn i värme har den delat sig så många gånger att kolonin syns med blotta ögat. Därför kan man räkna kolonier för att få ett mått på hur många bakterier som hamnade på plattan från början."
  },
  {
    q: "En häst och en åsna kan få en unge tillsammans, en mula. Varför räknas häst och åsna ändå som två olika arter?",

    opts: [
      { t: "Eftersom de har olika storlek och färg", c: false },

    fb: "Två djur tillhör samma art om de kan få ungar som i sin tur kan få egna ungar. Mulan är nästan alltid steril, alltså kan den inte föröka sig. Därför är häst och åsna olika arter, och mulan är en hybrid – en blandning mellan två arter. Utseende, föda och var djuren lever avgör inte vilken art de tillhör."
  },
  {
    q: "En bakterie delar sig var 20:e minut. Från början finns en enda bakterie, och alla nya bakterier fortsätter att dela sig i samma takt.",

    parts: [
      { label: "a) Antal bakterier efter 2 timmar", ans: 64, unit: "st" },
      { label: "b) Antal bakterier efter 4 timmar", ans: 4096, unit: "st" }

  {
    q: "Vilka påståenden om virus stämmer?",

    fb: "Inget av påståendena stämmer. Virus är inte bakterier och inte ens celler. Ett virus består i stort sett bara av arvsanlag inneslutna i ett skal. Det kan inte föröka sig på egen hand utan måste ta sig in i en levande cell. Virus är dessutom så små att man behöver ett elektronmikroskop för att se dem."
  },
  {
    q: "Ordna stegen när ett virus förökar sig. Använd pilarna för att flytta raderna.",
    type: "order",
    items: [
      "Cellen börjar tillverka nya viruspartiklar",
      "Viruset fäster på en cell",
      "Cellen spricker och de nya virusen sprids",
      "Viruset tömmer sina arvsanlag i cellen"

      "Viruset fäster på en cell",
      "Viruset tömmer sina arvsanlag i cellen",
      "Cellen börjar tillverka nya viruspartiklar",
      "Cellen spricker och de nya virusen sprids"
    ],
    fb: "Viruset fäster först på cellen och tömmer sedan in sina arvsanlag. Arvsanlagen lurar cellen att tillverka nya viruspartiklar i stället för det cellen själv behöver. Till slut spricker cellen och de nya virusen sprids vidare till nya celler. Det kan ske i bakterier likaväl som i växt- och djurceller."
  },
  {
    q: "Hos vilken grupp av svampar bildas sporerna i tätt packade rör på undersidan av hatten?",
    type: "single",

  },
  {

    badge: "Stämmer eller stämmer inte? – välj för varje påstående",

    rows: [

      { t: "Kantareller har tunna skivor under hatten", ans: "Stämmer inte" },
      { t: "Svampsporer är så små att de kan spridas långt med vinden", ans: "Stämmer" },

  {

    type: "multi",
    opts: [
      { t: "Olika celler kan vara specialiserade på olika uppgifter", c: true },

  {

      { t: "Mycelet bildar hela tiden nya trådar och har ingen bestämd livslängd", c: true }
    ],
    fb: "Sporkropparna vissnar efter någon vecka, men själva svampen – mycelet – lever vidare under marken. Den håller sig ”evigt ung” genom att ständigt bilda nya svamptrådar. Ett mycel kan därför bli både enormt stort och mycket gammalt; honungsskivlingens jättemycel i Nordamerika tros vara minst 2 400 år. Sporerna behövs för att sprida svampen till nya platser, inte för att hålla ett mycel vid liv."
  }
];

// ── Övningsformat: inmatning, skriv svaret, para ihop/sortera, ordna ──
function isCustom(q) {
  return q.type === 'numeric' || q.type === 'text' || q.type === 'match' || q.type === 'order';
}

function normText(s) {
  return String(s).toLowerCase().replace(/[.,!?"”“']/g, '').replace(/\s+/g, ' ').trim().replace(/^(en|ett) /, '');
}

// Antal ändringar (tecken) som skiljer två ord åt – används för att godta små stavfel
function editDistance(a, b) {
  var prev = [], cur, i, j;
  for (j = 0; j <= b.length; j++) prev[j] = j;
  for (i = 1; i <= a.length; i++) {
    cur = [i];
    for (j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}

function checkText(value, accepted) {
  var v = normText(value);
  if (!v) return 'wrong';
  if (accepted.some(function(a) { return normText(a) === v; })) return 'exact';
  if (v.length >= 5 && accepted.some(function(a) { return editDistance(normText(a), v) <= 1; })) return 'typo';
  return 'wrong';
}

var orderState = [];

function shortNum(n) {
  return String(n).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function parseNum(s) {
  var v = parseFloat(String(s).replace(/\s/g, '').replace(',', '.'));
  return isNaN(v) ? null : v;
}

function renderWork(q, list) {
  var box = document.createElement('div');
  box.className = 'work-box';
  q.work.forEach(function(line) {
    var d = document.createElement('div');
    d.textContent = line;
    box.appendChild(d);
  });
  list.appendChild(box);
}

function renderCustom(q, list) {
  if (q.type === 'numeric') {
    if (!q.badge) document.getElementById('typeBadge').textContent =
      q.parts.length > 1 ? 'Räkna ut – lös i steg och skriv dina svar' : 'Räkna ut – skriv ditt svar';
    q.parts.forEach(function(p, i) {
      var row = document.createElement('div');
      row.className = 'part-row';
      row.innerHTML = '<span class="part-label"></span><span class="part-input">' +
        '<input class="num-input" type="text" inputmode="decimal" autocomplete="off" id="part' + i + '">' +
        '<span></span></span>';
      row.querySelector('.part-label').textContent = p.label;
      row.querySelector('.part-input span').textContent = p.unit;
      list.appendChild(row);
    });
  } else if (q.type === 'text') {
    if (!q.badge) document.getElementById('typeBadge').textContent = 'Skriv svaret';
    q.parts.forEach(function(p, i) {
      var row = document.createElement('div');
      row.className = 'part-row';
      row.innerHTML = '<span class="part-label"></span><span class="part-input">' +
        '<input class="txt-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" id="part' + i + '">' +
        '</span>';
      row.querySelector('.part-label').textContent = p.label;
      list.appendChild(row);
    });
  } else if (q.type === 'match') {
    q.rows.forEach(function(r, i) {
      var row = document.createElement('div');
      row.className = 'part-row';
      var lab = document.createElement('span');
      lab.className = 'part-label';
      lab.textContent = r.t;
      var sel = document.createElement('select');
      sel.className = 'sel-input';
      sel.id = 'part' + i;
      sel.innerHTML = '<option value="">Välj …</option>';
      q.choices.forEach(function(c) {
        var o = document.createElement('option');
        o.value = c; o.textContent = c;
        sel.appendChild(o);
      });
      row.appendChild(lab);
      row.appendChild(sel);
      list.appendChild(row);
    });
  } else if (q.type === 'order') {
    if (!q.badge) document.getElementById('typeBadge').textContent = 'Ordna – flytta raderna till rätt ordning';
    orderState = q.items.slice();
    drawOrder(list, false);
  }
  var first = list.querySelector('input, select');
  if (first && window.matchMedia('(pointer: fine)').matches) first.focus();
}

function drawOrder(list, done, q) {
  list.querySelectorAll('.order-item').forEach(function(el) { el.remove(); });
  orderState.forEach(function(t, i) {
    var row = document.createElement('div');
    row.className = 'order-item';
    if (done) row.classList.add(t === q.answer[i] ? 'correct' : 'incorrect');
    row.innerHTML = '<span class="order-pos">' + (i + 1) + '.</span><span class="order-text"></span>' +
      '<button class="order-btn" aria-label="Flytta upp">▲</button><button class="order-btn" aria-label="Flytta ned">▼</button>';
    row.querySelector('.order-text').textContent = done && t !== q.answer[i]
      ? t + '  (rätt plats: ' + (q.answer.indexOf(t) + 1) + ')' : t;
    var btns = row.querySelectorAll('.order-btn');
    btns[0].disabled = done || i === 0;
    btns[1].disabled = done || i === orderState.length - 1;
    btns[0].onclick = function() { swapOrder(list, i, i - 1); };
    btns[1].onclick = function() { swapOrder(list, i, i + 1); };
    list.appendChild(row);
  });
}

function swapOrder(list, a, b) {
  if (checked) return;
  var tmp = orderState[a]; orderState[a] = orderState[b]; orderState[b] = tmp;
  drawOrder(list, false);
}

function checkCustom(q) {
  var list = document.getElementById('optionsList');
  var results = [];

  if (q.type === 'order') {
    orderState.forEach(function(t, i) { results.push(t === q.answer[i]); });
    drawOrder(list, true, q);
  } else {
    var rows = list.querySelectorAll('.part-row');
    var defs = q.type === 'numeric' || q.type === 'text' ? q.parts : q.rows;
    defs.forEach(function(d, i) {
      var inp = document.getElementById('part' + i);
      var ok, typo = false;
      if (q.type === 'numeric') {
        var v = parseNum(inp.value);
        ok = v !== null && Math.abs(v - d.ans) <= Math.abs(d.ans) * 0.01 + 1e-9;
      } else if (q.type === 'text') {
        var res = checkText(inp.value, d.ans);
        ok = res !== 'wrong';
        typo = res === 'typo';
      } else {
        ok = inp.value === d.ans;
      }
      inp.disabled = true;
      results.push(ok);
      rows[i].classList.add(ok ? 'correct' : 'incorrect');
      if (!ok || typo) {
        var note = document.createElement('span');
        note.className = 'correct-note';
        if (typo) note.textContent = 'Godkänt, men det stavas: ' + d.show;
        else if (q.type === 'numeric') note.textContent = 'Rätt svar: ' + shortNum(d.ans) + ' ' + d.unit;
        else if (q.type === 'text') note.textContent = 'Rätt svar: ' + d.show;
        else note.textContent = 'Rätt svar: ' + d.ans;
        rows[i].appendChild(note);
      }
    });
  }

  var nRight = results.filter(Boolean).length;
  var isExact = nRight === results.length;
  var isPartial = !isExact && nRight > 0;

  if (isExact) score++;
  answers.push(isExact ? 1 : 0);
  saveProgress();

  var fb = document.getElementById('feedbackBox');
  var verdict = document.getElementById('feedbackVerdict');
  if (isExact) {
    fb.className = 'feedback-box correct';
    verdict.textContent = 'Rätt.';
  } else if (isPartial) {
    fb.className = 'feedback-box partial';
    verdict.textContent = 'Delvis rätt. (' + nRight + ' av ' + results.length + ' rätt)';
  } else {
    fb.className = 'feedback-box incorrect';
    verdict.textContent = 'Fel.';
  }
  document.getElementById('feedbackText').textContent = q.fb;
  fb.style.display = 'block';
  document.getElementById('checkBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-block';
}

let current = 0;
let score = 0;
let answers = [];
let checked = false;

// ── localStorage helpers ──────────────────────────────────────────
function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      currentQuestion: current + 1,
      score: score,
      answers: answers
    }));
  } catch(e) {}
}

function clearProgress() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

// ── Card template ─────────────────────────────────────────────────
function getCardTemplate() {
  return `
    <div class="question-type-badge" id="typeBadge"></div>
    <div class="question-text" id="questionText"></div>
    <div class="options-list" id="optionsList"></div>
    <div class="btn-row">
      <button class="btn" id="checkBtn" onclick="checkAnswer()">Kontrollera</button>
      <button class="btn" id="nextBtn" style="display:none" onclick="nextQuestion()">Nästa fråga →</button>
    </div>
    <div class="feedback-box" id="feedbackBox">
      <div class="feedback-verdict" id="feedbackVerdict"></div>
      <div id="feedbackText"></div>
    </div>
  `;
}

// ── Init ──────────────────────────────────────────────────────────
function init() {
  const saved = loadProgress();
  if (saved && saved.currentQuestion > 0 && saved.currentQuestion < quizData.length) {
    showResumeScreen(saved);
  } else {
    clearProgress();
    render();
  }
}

function showResumeScreen(saved) {
  const nextQ = saved.currentQuestion;
  document.getElementById('progressText').textContent =
    'Fråga ' + (nextQ + 1) + ' av ' + quizData.length;
  document.getElementById('progressBar').style.width =
    (nextQ / quizData.length * 100) + '%';

  document.getElementById('questionCard').innerHTML =
    '<div class="resume-screen">' +
    '<div class="resume-title">Fortsätt där du slutade</div>' +
    '<div class="resume-info">Du är på fråga <strong>' + (nextQ + 1) + '</strong> av ' + quizData.length + '</div>' +
    '<div class="resume-score">' + saved.score + ' rätt hittills</div>' +
    '<div class="btn-row" style="justify-content:center; margin-top:1.5rem;">' +
    '<button class="btn" onclick="continueQuiz()">Fortsätt</button>' +
    '<button class="btn btn-outline" onclick="freshStart()">Börja om</button>' +
    '</div></div>';
}

function continueQuiz() {
  const saved = loadProgress();
  if (saved) {
    current = saved.currentQuestion;
    score = saved.score;
    answers = saved.answers || [];
  }
  document.getElementById('questionCard').innerHTML = getCardTemplate();
  render();
}

function freshStart() {
  clearProgress();
  current = 0; score = 0; answers = [];
  document.getElementById('questionCard').innerHTML = getCardTemplate();
  render();
}

// ── Render ────────────────────────────────────────────────────────
function render() {
  const q = quizData[current];
  const isSingle = q.type === 'single';
  const pct = (current / quizData.length) * 100;

  document.getElementById('progressText').textContent =
    'Fråga ' + (current + 1) + ' av ' + quizData.length;
  document.getElementById('progressBar').style.width = pct + '%';

  document.getElementById('typeBadge').textContent = q.badge || (isSingle
    ? 'Enval – välj ett alternativ'
    : 'Flerval – ett eller flera alternativ kan vara rätta');

  document.getElementById('questionText').innerHTML = q.q.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');

  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  if (q.work) renderWork(q, list);

  if (isCustom(q)) renderCustom(q, list);
  else q.opts.forEach(function(opt, i) {
    var label = document.createElement('label');
    label.className = 'option-label';

    var input = document.createElement('input');
    input.type = isSingle ? 'radio' : 'checkbox';
    input.className = 'option-input';
    input.id = 'opt' + i;
    if (isSingle) input.name = 'quiz-option';

    var textSpan = document.createElement('span');
    textSpan.className = 'option-text';
    textSpan.textContent = ['A', 'B', 'C', 'D'][i] + ') ' + opt.t;

    label.appendChild(input);
    label.appendChild(textSpan);

    input.addEventListener('change', function() {
      if (checked) return;
      if (isSingle) {
        list.querySelectorAll('.option-label').forEach(function(l) {
          l.classList.remove('selected');
        });
      }
      label.classList.toggle('selected', input.checked);
    });

    list.appendChild(label);
  });

  document.getElementById('checkBtn').style.display = 'inline-block';
  document.getElementById('checkBtn').disabled = false;
  document.getElementById('nextBtn').style.display = 'none';

  var fb = document.getElementById('feedbackBox');
  fb.style.display = 'none';
  fb.className = 'feedback-box';
  checked = false;
}

// ── Check answer ──────────────────────────────────────────────────
function checkAnswer() {
  if (checked) return;
  checked = true;

  var q = quizData[current];
  if (isCustom(q)) { checkCustom(q); return; }
  var isSingle = q.type === 'single';
  var labels = document.querySelectorAll('.option-label');
  var inputs = isSingle
    ? document.querySelectorAll('input[name="quiz-option"]')
    : document.querySelectorAll('.option-input');

  var selected = [];
  inputs.forEach(function(inp, i) { if (inp.checked) selected.push(i); });

  var correct = [];
  q.opts.forEach(function(opt, i) { if (opt.c) correct.push(i); });

  labels.forEach(function(label, i) {
    label.classList.add('disabled', 'checked');
    var inp = label.querySelector('input');
    inp.disabled = true;
    var textSpan = label.querySelector('.option-text');
    var isCorrect = q.opts[i].c;
    var wasSelected = inp.checked;

    if (isCorrect) {
      label.classList.add('correct');
      var ind = document.createElement('span');
      ind.className = 'option-indicator';
      ind.textContent = '✓';
      label.insertBefore(ind, textSpan);
    } else if (wasSelected && !isCorrect) {
      label.classList.add('incorrect');
      var ind2 = document.createElement('span');
      ind2.className = 'option-indicator';
      ind2.textContent = '✗';
      label.insertBefore(ind2, textSpan);
    }
    label.classList.remove('selected');
  });

  var correctSet = new Set(correct);
  var isExact = selected.length === correct.length &&
                selected.every(function(i) { return correctSet.has(i); });
  var isPartial = !isSingle && !isExact && selected.length > 0 &&
                  selected.some(function(i) { return correctSet.has(i); });

  if (isExact) score++;
  answers.push(isExact ? 1 : 0);
  saveProgress();

  var fb = document.getElementById('feedbackBox');
  var verdict = document.getElementById('feedbackVerdict');
  var fbText = document.getElementById('feedbackText');

  if (isExact) {
    fb.className = 'feedback-box correct';
    verdict.textContent = 'Rätt.';
  } else if (isPartial) {
    fb.className = 'feedback-box partial';
    verdict.textContent = 'Delvis rätt.';
  } else {
    fb.className = 'feedback-box incorrect';
    verdict.textContent = 'Fel.';
  }

  fbText.textContent = q.fb;
  fb.style.display = 'block';
  document.getElementById('checkBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-block';
}

// ── Navigation ────────────────────────────────────────────────────
function nextQuestion() {
  current++;
  if (current >= quizData.length) {
    showResults();
  } else {
    render();
  }
}

function showResults() {
  clearProgress();
  document.getElementById('progressText').textContent = 'Resultat';
  document.getElementById('progressBar').style.width = '100%';

  document.getElementById('questionCard').innerHTML =
    '<div style="text-align:center; padding:1rem 0;">' +
    '<div style="font-size:1.25rem;font-weight:700;color:var(--text-primary);margin-bottom:1.5rem;">Resultat</div>' +
    '<div style="font-size:3.5rem;font-weight:800;color:var(--accent);line-height:1;">' + score + '</div>' +
    '<div style="font-size:1rem;color:var(--text-secondary);margin-top:0.5rem;margin-bottom:0.25rem;">av ' + quizData.length + ' rätt</div>' +
    '<div style="font-size:0.95rem;color:var(--text-secondary);margin-bottom:2rem;">Du svarade rätt på ' + score + ' av ' + quizData.length + ' frågor.</div>' +
    '<button class="btn" onclick="restart()">Starta om</button>' +
    '</div>';
}

function restart() {
  clearProgress();
  current = 0; score = 0; answers = []; checked = false;
  document.getElementById('questionCard').innerHTML = getCardTemplate();
  render();
}

init();
</script>
