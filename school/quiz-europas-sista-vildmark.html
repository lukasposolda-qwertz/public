<script>
const quizData = [
{question:"Vilken växtzon ligger högst upp på fjället?",type:"single",options:[
  {text:"Fjällnära barrskog",correct:false},
  {text:"Fjällbjörkskog",correct:false},
  {text:"Kalfjället",correct:true},
  {text:"Barrskogsbältet",correct:false}
],feedback:"Kalfjället är den översta växtzonen, ovanför trädgränsen, där bara låga växter och lavar klarar sig. Fjällbjörkskog ligger mellan barrskogen och kalfjället. Fjällnära barrskog ligger längst ner, vid fjällets fot. Barrskogsbältet är inte en egen zon på själva fjället utan syftar på skogslandskapet långt nedanför fjällkedjan."},

{question:"Vilka påståenden om den fjällnära barrskogen stämmer?",type:"multi",options:[
  {text:"Träden där kan bli mycket gamla eftersom skogen på sina håll aldrig har avverkats",correct:true},
  {text:"Döda och ihåliga träd kan vara viktiga boplatser och födokällor för insekter och fåglar",correct:true},
  {text:"Skäggformade lavar som hänger i grenarna trivs bäst på gamla träd",correct:true},
  {text:"Alla träd i den fjällnära barrskogen är lövträd",correct:false}
],feedback:"A, B och C stämmer. Gamla, orörda barrskogar hyser ofta flera hundra år gamla granar, och döda träd samt hängande lavar är viktiga livsmiljöer för många arter. D är fel — den fjällnära barrskogen domineras av barrträd som gran, inte lövträd."},

{question:"Vad förklarar varför granar inte klarar av att växa lika högt upp på fjället som fjällbjörkar?",type:"multi",options:[
  {text:"Granen tål sämre kyla och kraftig vind än björken",correct:true},
  {text:"Granen behöver en tjockare kostym av barr för att överleva",correct:false},
  {text:"Granens rötter kräver ett tjockare jordlager än björkens",correct:true},
  {text:"Granen växer generellt snabbare än björken",correct:false}
],feedback:"A och C är korrekta — högre upp blir klimatet kallare och blåsigare samtidigt som jordlagret blir tunnare, vilket gran har svårare att klara än den mer anpassningsbara fjällbjörken. B är nonsens — barrmängd har inget med höjdgränsen att göra. D är fel, och dessutom irrelevant för frågan om höjdgräns."},

{question:"Varför är fjällbjörkarna i fjällbjörkskogen ofta korta och krokiga i stället för höga och raka?",type:"single",options:[
  {text:"De är unga träd som inte hunnit växa sig höga än",correct:false},
  {text:"Krokig växtform gör dem mindre känsliga för att vindar ska välta dem",correct:true},
  {text:"De får för lite solljus för att växa raka",correct:false},
  {text:"Djur som betar på topparna hindrar dem från att växa raka",correct:false}
],feedback:"B är rätt — den låga, krokiga formen är en anpassning som gör träden mer stabila i den hårda vinden. A stämmer inte, det handlar om en anpassning snarare än ålder. C är fel, ljustillgången är inte problemet på det öppna fjället. D är en rimlig gissning men inte den huvudsakliga förklaringen till formen."},

{question:"Vilka egenskaper gör fjällbjörken bra anpassad för livet högt upp på fjället?",type:"multi",options:[
  {text:"Stammen är böjlig och kan tåla att snödrivor trycker på",correct:true},
  {text:"Om stammen går av kan nya skott växa upp igen",correct:true},
  {text:"Trädet fäller alla sina blad redan i juni för att spara energi",correct:false},
  {text:"Trädet klarar att stå tätt tillsammans med videbuskar utan att konkurrera om ljus",correct:false}
],feedback:"A och B stämmer — böjlighet och förmåga att skjuta nya skott gör björken tålig mot både snötyngd och skador. C är felaktigt påhittat; björkar fäller löv på hösten som andra lövträd, inte redan i juni. D är fel — videbuskar och björkar konkurrerar visst om utrymme, vilket gör skogen svårframkomlig."},

{question:"Vad kännetecknar klimatet på kalfjället?",type:"single",options:[
  {text:"Det är mycket blåsigt, kallt och jordlagret är tunt",correct:true},
  {text:"Det är skyddat från vind eftersom det ligger i en dalgång",correct:false},
  {text:"Det är fuktigt och varmt större delen av året",correct:false},
  {text:"Temperaturen är stabil året runt utan större variationer",correct:false}
],feedback:"A är korrekt — kalfjället är öppet, högt beläget, vindutsatt och har ett tunt jordlager, vilket gör klimatet extremt. B, C och D beskriver alla motsatsen till hur det faktiskt är på kalfjället, som är känt för sitt hårda och varierande klimat."},

{question:"Vilka av följande hjälper en växt att överleva vindpinade platser på kalfjället?",type:"multi",options:[
  {text:"Att växa krypande och tätt intill marken",correct:true},
  {text:"Att ha extra höga stjälkar som sticker upp över snötäcket",correct:false},
  {text:"Att bilda tjocka, tuvformade mattor tillsammans med andra växter av samma art",correct:true},
  {text:"Att söka skydd bakom stenar, i gropar eller bakom små kullar",correct:true}
],feedback:"A, C och D är riktiga överlevnadsknep — låg växtform, tuvor och lä-platser skyddar mot den hårda vinden. B är fel och dessutom motsatsen till hur fjällväxter faktiskt beter sig: höga stjälkar skulle exponeras mer för vinden, inte skyddas."},

{question:"Hur kan vissa lavar bidra till att ny mark bildas på berghällar och stenar?",type:"single",options:[
  {text:"De släpper ifrån sig en syra som långsamt löser upp stenens yta",correct:true},
  {text:"De drar till sig fukt som fryser och spränger sönder stenen",correct:false},
  {text:"De lockar till sig insekter som gnager sönder stenytan",correct:false},
  {text:"De växer så tungt att stenen sakta pressas sönder",correct:false}
],feedback:"A stämmer — vissa lavar utsöndrar en syra som gör att de kan få fäste på annars kal sten och sakta bryta ner ytan. B, C och D beskriver mekanismer som inte har med lavars egen biologi att göra."},

{question:"Vilka påståenden om glaciärer stämmer?",type:"multi",options:[
  {text:"En glaciär bildas av snö som packats ihop till is under lång tid",correct:true},
  {text:"Glaciäris rör sig och nöter sakta ner berget under sig",correct:true},
  {text:"Glaciärer i Sverige finns bara på låglänta slätter",correct:false},
  {text:"Glaciärers storlek kan förändras med klimatet",correct:true}
],feedback:"A, B och D är korrekta beskrivningar av hur glaciärer bildas, rör sig och påverkas av klimatet. C är fel — glaciärer bildas där snö kan ligga kvar och packas år efter år, vilket kräver hög höjd och kyla, inte låglänta slätter."},

{question:"Ungefär hur många glaciärer finns det på de svenska fjällens toppar?",type:"single",options:[
  {text:"Omkring 30",correct:false},
  {text:"Omkring 300",correct:true},
  {text:"Omkring 3 000",correct:false},
  {text:"Omkring 30 000",correct:false}
],feedback:"B är korrekt — det finns omkring 300 glaciärer i de svenska fjällen. De övriga alternativen ligger alla för långt ifrån det faktiska antalet."},

{question:"Varför byter fjällräven och skogsharen till vit päls på vintern?",type:"single",options:[
  {text:"Den vita pälsen håller värmen bättre än den bruna",correct:false},
  {text:"Den vita färgen gör dem svårare att upptäcka mot den snötäckta marken",correct:true},
  {text:"Vit päls väger mindre än brun päls, vilket sparar energi",correct:false},
  {text:"Det är ett sätt att locka till sig en partner inför parningssäsongen",correct:false}
],feedback:"B är rätt — kamouflage mot snön gör det lättare för skogsharen att undgå att bli upptäckt och för fjällräven att smyga sig på byten. A, C och D är alla rimligt låtande men felaktiga förklaringar till pälsbytet."},

{question:"Vilka djur byter päls- eller fjäderdräkt mellan sommar och vinter för att smälta in i omgivningen?",type:"multi",options:[
  {text:"Skogsharen",correct:true},
  {text:"Fjällräven",correct:true},
  {text:"Fjälluggla",correct:true},
  {text:"Lämmeln",correct:false}
],feedback:"A, B och C byter alla färg mellan årstiderna — skogsharen och fjällräven blir vita på vintern, och fjällugglan har en ljus, snölik fjäderdräkt. D är fel — lämmeln behåller sin brungrå färg året runt och förlitar sig i stället på att gömma sig under snön för skydd."},

{question:"Vilken status har fjällugglan i Sverige idag?",type:"single",options:[
  {text:"Den är utrotningshotad",correct:true},
  {text:"Den är en av de vanligaste fjällfåglarna",correct:false},
  {text:"Den finns bara i Alperna, inte i Sverige",correct:false},
  {text:"Den flyttar aldrig från fjällen",correct:false}
],feedback:"A stämmer — fjällugglan räknas som en hotad art i Sverige. B är felaktigt, den är faktiskt ovanlig. C är fel, fjällugglan är en nordlig art som finns i de svenska fjällen, inte i Alperna. D är också fel, eftersom födotillgången styr om den stannar eller flyttar."},

{question:"Vilka djur får sitt liv direkt eller indirekt påverkat av hur många lämlar det finns ett visst år?",type:"multi",options:[
  {text:"Fjällräven, eftersom lämmel är viktig föda för dess ungar",correct:true},
  {text:"Fjällugglan, som kan låta bli att lägga ägg om det är ont om lämmel",correct:true},
  {text:"Renen, som är beroende av lämmel som huvudföda",correct:false},
  {text:"Stenbocken i Alperna, som konkurrerar med lämmeln om föda",correct:false}
],feedback:"A och B stämmer — lämmeln är en nyckelart i näringskedjan, och brist på lämmel kan göra att fjällrävsungar inte överlever och att fjällugglor avstår från att häcka. C är fel, renen lever huvudsakligen av lavar och andra växter. D är fel eftersom stenbocken lever i Alperna och aldrig delar livsmiljö med den svenska fjällämmeln."},

{question:"Om lämmelstammen är ovanligt liten ett visst år, vad blir den mest sannolika konsekvensen för fjällräven?",type:"single",options:[
  {text:"Fjällrävens ungar har svårare att överleva",correct:true},
  {text:"Fjällräven byter till en helt annan diet baserad på fisk",correct:false},
  {text:"Fjällräven vandrar permanent ner till Alperna",correct:false},
  {text:"Fjällräven slutar byta päls inför vintern",correct:false}
],feedback:"A är korrekt eftersom lämmel är en så viktig födokälla för fjällrävsungar att brist på lämmel direkt påverkar deras överlevnad. B, C och D beskriver orimliga eller påhittade beteenden som inte har någon grund i fjällrävens biologi."},

{question:"Vilken fågel känns igen på sitt \"spökliga skratt\" i fjällbjörkskogen?",type:"single",options:[
  {text:"Ljungpiparen",correct:false},
  {text:"Dalripan",correct:true},
  {text:"Fjällugglan",correct:false},
  {text:"Lammgamen",correct:false}
],feedback:"B är rätt — dalripan har ett läte som ofta beskrivs som ett skrattande eller kacklande ljud. Ljungpiparen har i stället en sorgsen, visslande läte och lever på kalfjället. Fjälluggla och lammgam är rovfåglar med helt andra läten."},

{question:"Vilka påståenden om ljungpiparen stämmer?",type:"multi",options:[
  {text:"Den bygger sitt bo direkt på marken",correct:true},
  {text:"Den håller till främst på kalfjället",correct:true},
  {text:"Den visslar starkare om något kommer nära boet",correct:true},
  {text:"Den bygger sitt bo högt uppe i fjällbjörkarnas grenar",correct:false}
],feedback:"A, B och C stämmer om ljungpiparen, en av kalfjällets vanligaste fåglar som varnar med kraftigare vissling när ungarna hotas. D är fel — eftersom ljungpiparen lägger sina ägg direkt på marken, inte i träd."},

{question:"Vad är tätört för typ av växt?",type:"single",options:[
  {text:"En köttätande växt som fångar insekter med klibbiga blad",correct:true},
  {text:"En giftig svamp som växer på myrar",correct:false},
  {text:"Ett träd som bara finns i fjällbjörkskogen",correct:false},
  {text:"En lav som bara växer på is",correct:false}
],feedback:"A är korrekt — tätört är en av få svenska köttätande växter och fångar små insekter på sina klibbiga blad för att kompensera för näringsfattig mark. B, C och D beskriver helt andra typer av organismer."},

{question:"Vilka steg ingår i hur tätörten får i sig näring från insekter?",type:"multi",options:[
  {text:"Insekten fastnar på det klibbiga bladet",correct:true},
  {text:"Bladet rullar ihop sig runt insekten",correct:true},
  {text:"Insekten löses upp och näringen sugs upp av bladet",correct:true},
  {text:"Roten tar upp insekten och för den till blomman för nedbrytning",correct:false}
],feedback:"A, B och C beskriver korrekt hur tätörten fångar och tar upp näring från insekter via bladen. D är felaktigt påhittat — processen sker i bladet, inte via roten, och blomman är inte inblandad i näringsupptaget."},

{question:"Vilken typ av växter saknar blommor och sprids i stället med sporer, till exempel de som växer längs fjällbäckar?",type:"single",options:[
  {text:"Ormbunkar",correct:true},
  {text:"Rosor",correct:false},
  {text:"Björkar",correct:false},
  {text:"Tallar",correct:false}
],feedback:"A är rätt — ormbunkar är sporväxter som saknar blommor och sprids via små sporer som sitter i klungor på undersidan av bladen. B, C och D är alla blomväxter eller barrträd som förökar sig med frön, inte sporer."},

{question:"Vilka påståenden om fjällängen stämmer?",type:"multi",options:[
  {text:"Jordlagret där är tjockare än på kalfjället, vilket gör att mer vatten kan hållas kvar",correct:true},
  {text:"Mygg och andra insekter där är en viktig födokälla för flyttfåglar",correct:true},
  {text:"Fjällängen har inga blommande växter alls",correct:false},
  {text:"Fjällängen ligger alltid högre upp än kalfjället",correct:false}
],feedback:"A och B stämmer — det tjockare jordlagret gör fjällängen grönskande, och de rikliga insekterna lockar flyttfåglar som behöver mycket mat till sina ungar. C är felaktigt, fjällängen är känd för sina blommor. D är fel — fjällängen ligger lägre än kalfjället, inte högre."},

{question:"Vad kallas fenomenet när solen inte går ner alls under några sommarveckor längst upp i norr?",type:"single",options:[
  {text:"Midnattssol",correct:true},
  {text:"Polarnatt",correct:false},
  {text:"Norrsken",correct:false},
  {text:"Solförmörkelse",correct:false}
],feedback:"A är korrekt — midnattssol innebär att solen är synlig dygnet runt under en period på sommaren i de nordligaste områdena. Polarnatt är motsatsen och sker på vintern. Norrsken och solförmörkelse är helt andra himlafenomen som inte har med ljusa nätter att göra."},

{question:"Vilka påståenden om samerna stämmer?",type:"multi",options:[
  {text:"De är en ursprungsbefolkning som levt i fjällen under lång tid",correct:true},
  {text:"Området de traditionellt bott i kallas för Sápmi",correct:true},
  {text:"Samerna har historiskt försörjt sig enbart genom gruvdrift",correct:false},
  {text:"Renskötsel har varit och är fortfarande viktigt för samisk kultur",correct:true}
],feedback:"A, B och D stämmer — samerna är urfolk med anknytning till Sápmi, och renskötseln har historiskt och fortfarande stor betydelse. C är fel, den traditionella försörjningen byggde på jakt, fiske och renskötsel, inte gruvdrift."},

{question:"Vilka skillnader finns mellan hur renskötsel bedrevs förr och hur den bedrivs idag?",type:"multi",options:[
  {text:"Förr fångade man in vilda renar, idag äger samerna tamrenar som föds upp",correct:true},
  {text:"Idag används ofta fordon och helikoptrar för att samla in renar",correct:true},
  {text:"Förr användes renar bara som sällskapsdjur, aldrig för mjölk eller kött",correct:false},
  {text:"Idag är renhjordarna ofta större än de traditionellt var",correct:true}

{question:"Vilken egenskap hos renens päls gör att den isolerar extra bra mot kyla?",type:"single",options:[

{question:"Vilka av följande påståenden om jakt på rovdjur i Sverige stämmer INTE?",type:"multi",options:[

];

const STORAGE_KEY = 'quiz-progress-quiz-europas-sista-vildmark';
const letters = ['A','B','C','D'];
let current = 0;
let score = 0;
let answers = [];
let checked = false;

const cardEl = document.getElementById('card');
const progressArea = document.getElementById('progressArea');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (typeof data.currentQuestion === 'number' && data.currentQuestion < quizData.length) {
      return data;
    }
    return null;
  } catch (e) { return null; }
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      currentQuestion: current,
      score: score,
      answers: answers
    }));
  } catch (e) {}
}

function clearProgress() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

function updateProgressBar() {
  progressText.textContent = 'Fråga ' + (current + 1) + ' av ' + quizData.length;
  progressFill.style.width = ((current) / quizData.length * 100) + '%';
}

function hideProgressBar() {
  progressArea.style.display = 'none';
}
function showProgressBar() {
  progressArea.style.display = 'block';
}

function renderResume(data) {
  hideProgressBar();
  cardEl.innerHTML = '';
  const h2 = document.createElement('h2');
  h2.textContent = 'Välkommen tillbaka';
  const info = document.createElement('div');
  info.className = 'resume-info';
  info.textContent = 'Du har kommit till fråga ' + (data.currentQuestion + 1) + ' av ' + quizData.length + ' (' + data.score + ' rätt hittills).';
  const btnRow = document.createElement('div');
  btnRow.className = 'resume-buttons';
  const continueBtn = document.createElement('button');
  continueBtn.textContent = 'Fortsätt';
  continueBtn.onclick = function() {
    current = data.currentQuestion;
    score = data.score;
    answers = data.answers || [];
    showProgressBar();
    renderQuestion();
  };
  const restartBtn = document.createElement('button');
  restartBtn.textContent = 'Börja om';
  restartBtn.className = 'btn-outline';
  restartBtn.onclick = function() {
    clearProgress();
    current = 0; score = 0; answers = [];
    showProgressBar();
    renderQuestion();
  };
  btnRow.appendChild(continueBtn);
  btnRow.appendChild(restartBtn);
  cardEl.appendChild(h2);
  cardEl.appendChild(info);
  cardEl.appendChild(btnRow);
}

function renderQuestion() {
  checked = false;
  updateProgressBar();
  const q = quizData[current];
  cardEl.innerHTML = '';

  if (current === 0) {
    const instr = document.createElement('div');
    instr.className = 'instructions';
    instr.textContent = 'Det här quizet blandar flervalsfrågor och envalsfrågor. Vid flervalsfrågor kan noll till alla alternativ vara rätta. Vid envalsfrågor är exakt ett alternativ rätt. Frågetypen visas vid varje fråga.';
    cardEl.appendChild(instr);
  }

  const typeIndicator = document.createElement('div');
  typeIndicator.className = 'type-indicator';
  typeIndicator.textContent = q.type === 'multi'
    ? 'Flerval – ett eller flera alternativ kan vara rätta'
    : 'Enval – välj ett alternativ';
  cardEl.appendChild(typeIndicator);

  const qText = document.createElement('div');
  qText.className = 'question-text';
  qText.textContent = q.question;
  cardEl.appendChild(qText);

  const optionsEl = document.createElement('div');
  optionsEl.className = 'options';
  optionsEl.id = 'optionsEl';

  q.options.forEach(function(opt, idx) {
    const label = document.createElement('label');
    label.className = 'option';
    label.dataset.idx = idx;

    const input = document.createElement('input');
    input.type = q.type === 'multi' ? 'checkbox' : 'radio';
    input.name = 'q' + current;
    input.value = idx;
    input.addEventListener('change', function() {
      if (q.type === 'single') {
        Array.from(optionsEl.children).forEach(function(el) { el.classList.remove('selected'); });
        label.classList.add('selected');
      } else {
        label.classList.toggle('selected', input.checked);
      }
    });

    const textSpan = document.createElement('span');
    textSpan.className = 'option-text';
    const mark = document.createElement('span');
    mark.className = 'mark';
    mark.textContent = letters[idx] + ')';
    textSpan.appendChild(mark);
    textSpan.appendChild(document.createTextNode(opt.text));

    label.appendChild(input);
    label.appendChild(textSpan);
    optionsEl.appendChild(label);
  });

  cardEl.appendChild(optionsEl);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  const checkBtn = document.createElement('button');
  checkBtn.textContent = 'Kontrollera';
  checkBtn.id = 'actionBtn';
  checkBtn.onclick = handleCheck;
  btnRow.appendChild(checkBtn);
  cardEl.appendChild(btnRow);
}

function handleCheck() {
  if (checked) return;
  const q = quizData[current];
  const optionsEl = document.getElementById('optionsEl');
  const labels = Array.from(optionsEl.children);
  const selectedIdx = [];
  labels.forEach(function(label, idx) {
    const input = label.querySelector('input');
    if (input.checked) selectedIdx.push(idx);
    input.disabled = true;
    label.classList.add('disabled');
  });

  const correctIdx = [];
  q.options.forEach(function(opt, idx) { if (opt.correct) correctIdx.push(idx); });

  let isCorrect = false;
  let isPartial = false;

  if (q.type === 'single') {
    isCorrect = selectedIdx.length === 1 && q.options[selectedIdx[0]].correct;
  } else {
    const selSet = new Set(selectedIdx);
    const corSet = new Set(correctIdx);
    isCorrect = selSet.size === corSet.size && [...selSet].every(function(i) { return corSet.has(i); });
    if (!isCorrect) {
      const overlap = selectedIdx.some(function(i) { return corSet.has(i); });
      isPartial = overlap && selectedIdx.length > 0;
    }
  }

  labels.forEach(function(label, idx) {
    const opt = q.options[idx];
    const wasSelected = selectedIdx.indexOf(idx) !== -1;
    if (opt.correct) {
      label.classList.add('correct-answer');
      const mark = label.querySelector('.mark');
      mark.textContent = '✓ ' + letters[idx] + ')';
    } else if (wasSelected) {
      label.classList.add('incorrect-answer');
      const mark = label.querySelector('.mark');
      mark.textContent = '✗ ' + letters[idx] + ')';
    }
  });

  const feedbackBox = document.createElement('div');
  feedbackBox.className = 'feedback-box ' + (isCorrect ? 'correct' : (isPartial ? 'partial' : 'incorrect'));
  const strong = document.createElement('strong');
  strong.textContent = isCorrect ? 'Rätt!' : (isPartial ? 'Delvis rätt.' : 'Fel.');
  const p = document.createElement('div');
  p.textContent = q.feedback;
  feedbackBox.appendChild(strong);
  feedbackBox.appendChild(p);
  cardEl.insertBefore(feedbackBox, document.querySelector('.btn-row'));

  answers[current] = isCorrect ? 1 : 0;
  if (isCorrect) score++;
  current++;
  saveProgress();
  current--;

  const actionBtn = document.getElementById('actionBtn');
  actionBtn.textContent = 'Nästa fråga →';
  actionBtn.onclick = advance;
  checked = true;
}

function advance() {
  current++;
  if (current >= quizData.length) {
    renderResults();
  } else {
    renderQuestion();
  }
}

function renderResults() {
  hideProgressBar();
  clearProgress();
  cardEl.innerHTML = '';
  const h2 = document.createElement('h2');
  h2.textContent = 'Resultat';
  const scoreEl = document.createElement('div');
  scoreEl.className = 'result-score';
  scoreEl.textContent = 'Du svarade rätt på ' + score + ' av ' + quizData.length + ' frågor';
  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  const restartBtn = document.createElement('button');
  restartBtn.textContent = 'Starta om';
  restartBtn.onclick = function() {
    current = 0; score = 0; answers = [];
    clearProgress();
    showProgressBar();
    renderQuestion();
  };
  btnRow.appendChild(restartBtn);
  cardEl.appendChild(h2);
  cardEl.appendChild(scoreEl);
  cardEl.appendChild(btnRow);
}

(function init() {
  const saved = loadProgress();
  if (saved) {
    renderResume(saved);
  } else {
    renderQuestion();
  }
})();
</script>
</body>
</html>
